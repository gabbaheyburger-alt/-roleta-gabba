<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cardápio · Feijuca do Gabba</title>
<meta name="description" content="Cardápio da Feijuca do Gabba, Paracuru-CE: feijoada, petiscos, pratos, chopp e sobremesas.">
<meta name="theme-color" content="#0c1610">
<link rel="icon" href="../logo.png">
<meta property="og:title" content="Cardápio · Feijuca do Gabba">
<meta property="og:image" content="../fotos/moela.jpg">
<style>
/* Cardápio digital da Feijuca: folha de papel com as seções do cardápio.
   Conteúdo em ../cardapio.json. No celular é uma coluna; em tela grande e na impressão (A4), duas colunas.
   Fontes locais em ../fontes/ para ficar igual na tela, no PDF e na imagem. */
@font-face { font-family: 'Alfa Slab One'; src: url(../fontes/alfa-slab-one-latin-400-normal.woff2) format('woff2'); font-weight: 400; font-display: swap; }
@font-face { font-family: 'Barlow'; src: url(../fontes/barlow-latin-400-normal.woff2) format('woff2'); font-weight: 400; font-display: swap; }
@font-face { font-family: 'Barlow'; src: url(../fontes/barlow-latin-600-normal.woff2) format('woff2'); font-weight: 600; font-display: swap; }
@font-face { font-family: 'Barlow'; src: url(../fontes/barlow-latin-700-normal.woff2) format('woff2'); font-weight: 700; font-display: swap; }
@font-face { font-family: 'Barlow Condensed'; src: url(../fontes/barlow-condensed-latin-600-normal.woff2) format('woff2'); font-weight: 600; font-display: swap; }
@font-face { font-family: 'Barlow Condensed'; src: url(../fontes/barlow-condensed-latin-700-normal.woff2) format('woff2'); font-weight: 700; font-display: swap; }
:root {
  --fundo: #0c1610; --verde: #163a26; --verde-2: #1f4d33; --papel: #fbf6ea; --papel-2: #f1e8d4;
  --tinta: #1d2a21; --tinta-2: #5d6b5f; --ouro: #c8902a; --linha: #d9cdb2;
  --display: 'Alfa Slab One', Rockwell, Georgia, serif;
  --label: 'Barlow Condensed', 'Arial Narrow', sans-serif;
  --body: 'Barlow', system-ui, -apple-system, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--fundo); color: var(--tinta); }
body { font-family: var(--body); font-size: 16px; line-height: 1.4; -webkit-font-smoothing: antialiased; padding: 0 0 calc(90px + env(safe-area-inset-bottom)); }
a { color: inherit; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--ouro); outline-offset: 3px; }

.barra-topo { max-width: 860px; margin: 0 auto; padding: max(12px, env(safe-area-inset-top)) 16px 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.barra-topo a { color: #d9e3d6; text-decoration: none; font: 600 .95rem var(--body); }
.barra-topo a.pdf { border: 1px solid #2f4a38; border-radius: 999px; padding: 7px 13px; }

.folha { max-width: 860px; margin: 0 auto; background: var(--papel); border-radius: 6px; overflow: hidden; box-shadow: 0 18px 50px rgba(0,0,0,.45);
  background-image: radial-gradient(circle at 1px 1px, rgba(29,42,33,.035) 1px, transparent 1.4px); background-size: 6px 6px; }
.cab { background: var(--verde); color: var(--papel); text-align: center; padding: 26px 20px 22px; position: relative;
  background-image: radial-gradient(120% 90% at 50% 0%, var(--verde-2), var(--verde) 70%); }
.cab img { width: 150px; height: auto; display: block; margin: 0 auto 10px; }
.cab h1 { margin: 0; font: 400 2rem/1 var(--display); letter-spacing: .02em; }
.cab p { margin: 8px 0 0; font: 600 .82rem var(--label); letter-spacing: .22em; text-transform: uppercase; color: #e7c27a; }
.cab::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 10px;
  background: radial-gradient(circle at 10px -4px, transparent 9px, var(--papel) 9.5px) 0 0 / 20px 10px repeat-x; }

.miolo { padding: 22px 20px 8px; }
.cols { columns: 1; column-gap: 40px; }
@media (min-width: 760px) { .cols { columns: 2; } .miolo { padding: 30px 36px 10px; } }
.secao { break-inside: avoid-column; margin: 0 0 22px; }
.secao h2 { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; font: 400 1.35rem/1 var(--display); color: var(--verde); }
.secao h2::after { content: ''; flex: 1; height: 2px; background: linear-gradient(90deg, var(--ouro), transparent); }
.item { break-inside: avoid; padding: 7px 0 8px; border-bottom: 1px dashed var(--linha); }
.item:last-child { border-bottom: 0; }
.item .l { display: flex; align-items: baseline; gap: 8px; }
.item b { font: 700 1.02rem/1.2 var(--body); }
.item .pts { flex: 1; min-width: 12px; border-bottom: 2px dotted #b9ab8c; transform: translateY(-4px); }
.item .p { font: 700 1.12rem var(--label); color: var(--verde); white-space: nowrap; letter-spacing: .01em; }
.item .p small { font-size: .78em; margin-right: 2px; color: var(--tinta-2); }
.item .d { margin: 3px 0 0; color: var(--tinta-2); font-size: .9rem; line-height: 1.35; max-width: 46ch; }
.item.dest { background: var(--papel-2); margin: 4px -10px; padding: 9px 10px 10px; border-radius: 10px; border-bottom: 0; }
.item.dest b::before { content: '★ '; color: var(--ouro); }

.rodape { margin: 4px 20px 0; padding: 16px 0 22px; border-top: 2px solid var(--verde); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 18px; font: 600 .95rem var(--body); color: var(--verde); }
@media (min-width: 760px) { .rodape { margin: 4px 36px 0; } }
.rodape span { display: inline-flex; align-items: center; gap: 6px; }
.rodape svg { width: 16px; height: 16px; }
.rodape .slogan { flex-basis: 100%; font: 400 1.05rem var(--display); color: var(--verde); }
.rodape small { flex-basis: 100%; color: var(--tinta-2); font-weight: 400; font-size: .8rem; }

.acoes { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(12,22,16,.95); border-top: 1px solid #22382a; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); }
.acoes div { max-width: 860px; margin: 0 auto; display: grid; grid-template-columns: 1fr auto; gap: 10px; }
.acoes a { display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 14px; text-decoration: none; }
.acoes .pedir { background: #eab14a; color: #10180f; font: 400 1.15rem var(--display); }
.acoes .zap { width: 52px; border: 1px solid #2f4a38; }
.acoes .zap svg { width: 24px; height: 24px; }

/* Impressão / PDF: uma folha A4 */
@page { size: A4; margin: 0; }
@media print {
  html, body { background: var(--papel); padding: 0; }
  .barra-topo, .acoes { display: none !important; }
  .folha { max-width: none; border-radius: 0; box-shadow: none; min-height: 297mm; display: flex; flex-direction: column; }
  .cab { padding: 7mm 10mm 6mm; display: flex; align-items: center; justify-content: center; gap: 6mm; text-align: left; }
  .cab img { width: 30mm; margin: 0; }
  .cab h1 { font-size: 22pt; }
  .cab p { font-size: 8.5pt; }
  .miolo { padding: 7mm 11mm 2mm; flex: 1; }
  .cols { columns: 2; column-gap: 9mm; }
  .secao { margin-bottom: 4.5mm; }
  .secao h2 { font-size: 13.5pt; margin-bottom: 1.5mm; }
  .item { padding: 1.3mm 0 1.5mm; }
  .item b { font-size: 10pt; }
  .item .p { font-size: 11pt; }
  .item .d { font-size: 8.3pt; margin-top: .6mm; }
  .item.dest { margin: .8mm -2.5mm; padding: 1.8mm 2.5mm; }
  .rodape { margin: 0 11mm; padding: 3mm 0 6mm; font-size: 9.5pt; }
  .rodape .slogan { font-size: 11pt; }
  .rodape small { font-size: 7.5pt; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>
</head>
<body>

<nav class="barra-topo">
  <a href="../">‹ Voltar</a>
  <a class="pdf" href="cardapio-feijuca.pdf" id="pdf">Salvar em PDF</a>
</nav>

<article class="folha">
  <header class="cab">
    <img src="../logo.png" alt="Feijuca do Gabba · Sabor de Boteco" width="382" height="364">
    <div>
      <h1>Cardápio</h1>
      <p>Sexta, sábado e domingo · 11h às 15h</p>
    </div>
  </header>
  <div class="miolo"><div class="cols" id="cols"></div></div>
  <footer class="rodape">
    <span class="slogan">Se a Feijuca é boa, imagina a resenha.</span>
    <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>@feijucadogabba</span>
    <span><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2z"/></svg>(85) 9 9851-5015</span>
    <span>Av. João Lopes Meireles, 1792 · Paracuru-CE</span>
    <small id="atual"></small>
  </footer>
</article>

<div class="acoes"><div>
  <a class="pedir" id="pedir" href="https://gabbaburger.saipos.com/home" target="_blank" rel="noopener">PEDIR DELIVERY</a>
  <a class="zap" id="zap" href="https://wa.me/5585998515015" target="_blank" rel="noopener" aria-label="WhatsApp"><svg viewBox="0 0 24 24" fill="#25d366" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3z"/></svg></a>
</div></div>

<script>
(function () {
  var box = document.getElementById('cols');
  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
  function desenha(C) {
    box.textContent = '';
    (C.secoes || []).forEach(function (s) {
      var sec = el('section', 'secao'); sec.append(el('h2', '', s.titulo));
      (s.itens || []).forEach(function (it) {
        if (!it || !it.nome || it.oculto) return;
        var d = el('div', 'item' + (it.destaque ? ' dest' : ''));
        var l = el('div', 'l'); l.append(el('b', '', it.nome), el('span', 'pts'));
        if (it.preco) { var p = el('span', 'p'); p.append(el('small', '', 'R$'), document.createTextNode(String(it.preco).replace(/^\s*R\$\s*/, ''))); l.append(p); }
        d.append(l);
        if (it.desc) d.append(el('p', 'd', it.desc));
        sec.append(d);
      });
      box.append(sec);
    });
    document.getElementById('atual').textContent = C.atualizado ? 'Preços de ' + C.atualizado.toLowerCase() + '. Podem mudar sem aviso.' : '';
  }
  // PDF sempre com os preços atuais: usa a impressão do celular (Salvar como PDF)
  document.getElementById('pdf').addEventListener('click', function (e) { if (window.print) { e.preventDefault(); window.print(); } });
  fetch('../cardapio.json?v=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (c) { if (c) desenha(c); }).catch(function () {});
  // mesmos links da bio
  fetch('../config.json?v=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (c) {
    var L = (c && c.links) || {};
    if (L.pedir) document.getElementById('pedir').href = L.pedir;
    if (L.whatsapp) document.getElementById('zap').href = L.whatsapp;
  }).catch(function () {});
})();
</script>
</body>
</html>
