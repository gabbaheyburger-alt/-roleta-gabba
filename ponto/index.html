<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ponto · Grupo Gabba</title>
<meta name="theme-color" content="#0E3B43">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icone-180.png">
<meta name="apple-mobile-web-app-title" content="Ponto">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="visual.css?v=20261111">
<style>
/* Ponto da equipe: relógio no topo; aviso do Wi-Fi; "é você?" com o último nome do celular; nomes por setor; botões grandes; confirmação com o nome em destaque */
.relogio { margin-left: auto; text-align: right; font-variant-numeric: tabular-nums; }
.relogio b { display: block; font-family: var(--titulo); font-size: 30px; font-weight: 700; line-height: 1; letter-spacing: -.02em; }
.relogio span { font-size: 13px; color: #B9D3D0; text-transform: capitalize; }
.main { max-width: 560px; margin: 0 auto; padding: 18px 16px 48px; display: flex; flex-direction: column; gap: 14px; }

/* "É você?" */
.voce { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; border: 2px solid var(--tinta); background: #F7FBFA; border-radius: var(--raio); padding: 16px; color: var(--texto); box-shadow: var(--sombra); }
.voce .ini { width: 52px; height: 52px; flex: 0 0 52px; border-radius: 50%; display: grid; place-items: center; background: var(--tinta); color: #fff; font: 700 22px var(--titulo); }
.voce .txt { flex: 1; min-width: 0; }
.voce small { display: block; font-size: 13px; font-weight: 600; color: var(--suave); }
.voce strong { display: block; font: 700 22px/1.2 var(--titulo); overflow-wrap: anywhere; }
.voce .st { font-size: 14px; font-weight: 600; color: var(--suave); }
.voce .seta { font: 700 26px var(--titulo); color: var(--tinta); }
.st.dentro { color: var(--ok); } .st.pausa { color: var(--alerta); }

/* Nomes */
.setor { font-size: 13px; font-weight: 700; color: var(--suave); text-transform: uppercase; letter-spacing: .06em; margin: 6px 0 8px; }
.nomes { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.nome { min-height: 84px; border-radius: var(--raio); border: 1px solid var(--linha); background: var(--papel); color: var(--texto); text-align: left; padding: 14px; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
.nome:hover:not(:disabled) { border-color: #AFC3C0; }
.nome span { font: 700 19px/1.2 var(--titulo); overflow-wrap: anywhere; }
.nome small { font-size: 13px; font-weight: 600; color: var(--suave); display: flex; align-items: center; gap: 6px; }
.nome small::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #B9C8C5; flex: 0 0 8px; }
.nome.dentro { background: #F4FBF8; border-color: #B9DDCD; } .nome.dentro small { color: var(--ok); } .nome.dentro small::before { background: var(--ok); }
.nome.pausa { background: #FFFAEE; border-color: #EBD9A8; } .nome.pausa small { color: var(--alerta); } .nome.pausa small::before { background: var(--alerta); }
.nome:disabled { opacity: .5; }

/* Pessoa escolhida */
.pessoa { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.pessoa h2 { font-size: 30px; font-weight: 700; overflow-wrap: anywhere; }
.voltar { font-weight: 600; font-size: 14px; border: 1px solid var(--linha); background: var(--papel); border-radius: var(--raio-p); padding: 9px 12px; color: var(--texto); flex: 0 0 auto; }
.hoje { display: flex; flex-wrap: wrap; gap: 6px; }
.hoje span { font-size: 14px; font-weight: 600; background: var(--tinta-suave); color: var(--tinta); border-radius: 999px; padding: 4px 12px; font-variant-numeric: tabular-nums; }
.lembrete { margin: 0; padding: 14px; border: 1px solid #EBD9A8; border-radius: var(--raio-p); background: var(--alerta-fundo); color: #6B4A05; font-weight: 600; }
.acoes { display: grid; gap: 10px; }
.acao { min-height: 84px; border-radius: var(--raio); border: none; color: #fff; display: flex; align-items: center; justify-content: center; gap: 10px; font: 700 22px var(--titulo); letter-spacing: -.01em; padding: 0 16px; }
.acao.entrada { background: var(--ok); }
.acao.saida_intervalo, .acao.volta_intervalo { background: var(--alerta); }
.acao.saida { background: var(--tinta); }
.acao.sec { background: var(--papel); color: var(--texto); border: 1px solid var(--linha); font: 600 17px var(--corpo); min-height: 56px; }
.acao:disabled { opacity: .5; }

/* Registrado */
.ok-card { text-align: center; padding: 28px 18px; }
.ok-card .check { width: 72px; height: 72px; border-radius: 50%; background: var(--ok); color: #fff; display: grid; place-items: center; margin: 0 auto 6px; font: 700 36px var(--titulo); }
.ok-card h2 { font-size: 22px; }
.ok-card .hora { font: 700 52px/1 var(--titulo); letter-spacing: -.03em; font-variant-numeric: tabular-nums; color: var(--tinta); margin: 6px 0; }
.ok-card p { margin: 0; color: var(--suave); }
.ok-card .flag, .ok-card .okmsg { margin: 4px 0 6px; }
.okmsg { color: var(--ok) !important; font-weight: 600; }

/* Confirmação */
dialog .label { text-transform: uppercase; letter-spacing: .06em; font-size: 12px; }
dialog h2 { font-size: 20px; margin: 10px 0 0; color: var(--suave); font-family: var(--corpo); font-weight: 600; }
dialog .identidade { font: 700 36px/1.1 var(--titulo); margin: 6px 0 4px; color: var(--tinta); overflow-wrap: anywhere; }
dialog .acoes { margin-top: 20px; }
dialog .acao { min-height: 60px; font-size: 18px; }
.rodape { text-align: center; font-size: 13px; color: var(--suave); margin: 4px 0 0; }
@media (max-width: 380px) { .relogio b { font-size: 24px; } .nomes { gap: 8px; } .nome span { font-size: 17px; } }
</style>
</head>
<body>
<header class="faixa"><div class="faixa-in">
  <div class="marca"><span class="marca-selo">G</span><div>Ponto da equipe<small id="titulo">Gabba Burger</small></div></div>
  <div class="relogio"><b id="hora">--:--</b><span id="data"></span></div>
</div></header>

<main class="main">
  <div class="notice" id="aviso" role="status" aria-live="polite">Conferindo a internet…</div>

  <section id="tela-nomes" style="display:flex;flex-direction:column;gap:14px">
    <button type="button" class="voce" id="voce" hidden><span class="ini" id="voce-ini"></span><span class="txt"><small>É você?</small><strong id="voce-nome"></strong><span class="st" id="voce-st"></span></span><span class="seta" aria-hidden="true">›</span></button>
    <div class="panel">
      <div class="label" id="lista-tit">Toque no seu nome</div>
      <div id="grupos"></div>
      <p class="hint">Use o seu próprio celular, conectado no Wi-Fi da loja.</p>
    </div>
  </section>

  <section class="panel" id="tela-pessoa" hidden>
    <div class="pessoa"><h2 id="p-nome"></h2><button class="voltar" id="p-voltar" type="button">‹ Não sou eu</button></div>
    <div class="hoje" id="p-hoje"></div>
    <p class="hint" id="p-escala"></p>
    <p class="lembrete" id="p-intervalo-aviso" role="status" hidden></p>
    <div class="acoes" id="p-acoes"></div>
    <div id="p-dica" class="hint"></div>
  </section>

  <section class="panel ok-card" id="tela-ok" aria-live="polite" hidden>
    <div class="check">✓</div>
    <h2 id="ok-txt"></h2>
    <div class="hora" id="ok-hora"></div>
    <p id="ok-nome"></p>
    <p id="ok-alerta-intervalo" role="status" hidden></p>
    <div class="acoes" style="margin-top:14px"><button class="acao saida" id="ok-fim" type="button">Pronto</button><button class="acao sec" id="ok-desfazer" type="button">Errei · desfazer</button></div>
  </section>

  <p class="rodape">Controle interno do Grupo Gabba. Dúvida ou erro no registro: fale com o gerente.</p>
</main>

<dialog id="confirmacao" aria-labelledby="conf-titulo" aria-describedby="conf-descricao">
  <div class="label">Confira seu nome</div>
  <h2 id="conf-titulo">Confirmar registro</h2>
  <p id="conf-nome" class="identidade"></p>
  <p id="conf-descricao" class="hint">Se não for você, toque em Cancelar.</p>
  <div class="acoes"><button type="button" id="conf-sim" class="acao entrada">Confirmar</button><button type="button" id="conf-nao" class="acao sec" autofocus>Cancelar</button></div>
</dialog>
<script src="escala.js?v=20261023"></script>
<script>
(function () {
  const $ = id => document.getElementById(id);
  // loja: vem do link (?loja=); sem link, usa a última loja aberta neste celular (para o atalho da tela inicial)
  const pedida = new URLSearchParams(location.search).get('loja');
  let salva = ''; try { salva = localStorage.getItem('ponto-loja') || ''; } catch (e) {}
  const LOJA = (pedida || salva || 'gabba').toLowerCase();
  const NOME_ACAO = { entrada: 'Entrada', saida_intervalo: 'Saída para intervalo', volta_intervalo: 'Volta do intervalo', saida: 'Saída' };
  const hm = ts => new Date(ts).toLocaleTimeString('pt-BR', { timeZone: 'America/Fortaleza', hour: '2-digit', minute: '2-digit', hour12: false });
  let regraInicio=null;
  let CFG = null, SRV = '', ultimos = {}, redeOk = false, atual = null;

  // aparelho: identifica este celular (sem dados pessoais), para o gerente ver se alguém bateu por outra pessoa
  let aparelho = '';
  try { aparelho = localStorage.getItem('ponto-aparelho') || ''; if (!aparelho) { aparelho = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2)).slice(0, 18); localStorage.setItem('ponto-aparelho', aparelho); } } catch (e) { aparelho = 'sem-memoria-' + String(Math.random()).slice(2, 10); }
  const ultimoNome = () => { try { return localStorage.getItem('ponto-ultimo-nome-' + LOJA) || localStorage.getItem('ponto-ultimo-nome') || ''; } catch (e) { return ''; } };

  function relogio() { const d = new Date(); $('hora').textContent = hm(d.getTime()); $('data').textContent = d.toLocaleDateString('pt-BR', { timeZone: 'America/Fortaleza', weekday: 'short', day: '2-digit', month: '2-digit' }); }
  relogio(); setInterval(relogio, 10000);

  function aviso(tipo, html) { const a = $('aviso'); a.className = 'notice' + (tipo ? ' ' + tipo : ''); a.innerHTML = html; const b = a.querySelector('button'); if (b) b.onclick = carregaEstado; }

  async function api(rota, corpo) {
    const op = corpo ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corpo) } : {};
    const r = await fetch(SRV + '/ponto/' + rota, op);
    const j = await r.json().catch(() => ({}));
    return { ok: r.ok, status: r.status, j };
  }

  function proximas(ult) {
    if (!ult || ult.acao === 'saida') return ['entrada'];
    if (ult.acao === 'saida_intervalo') return ['volta_intervalo'];
    return ['saida_intervalo', 'saida'];
  }
  const diaAtual = () => new Date(Date.now() - 8 * 3600e3).toISOString().slice(0, 10);
  const planoAtual = p => PontoEscala.detalhe(p || {}, diaAtual(), CFG.lojas[LOJA]);
  function statusTxt(ult, p) {
    if (!ult) return { t: 'Ainda não bateu hoje', c: '' };
    if (ult.acao === 'saida') return { t: 'Saiu às ' + hm(ult.ts), c: '' };
    if (ult.acao === 'saida_intervalo') return { t: 'Intervalo · volta às ' + hm(ult.ts + planoAtual(p).intervaloMin * 60000), c: 'pausa' };
    return { t: 'Na loja desde ' + hm(ult.ts), c: 'dentro' };
  }

  function desenhaNomes() {
    const L = CFG.lojas[LOJA], box = $('grupos'); box.innerHTML = '';
    const ativos = L.equipe.filter(p => p.ativo !== false);
    const setores = [...new Set(ativos.map(p => p.setor))];
    setores.forEach(s => {
      if (setores.length > 1) { const t = document.createElement('div'); t.className = 'setor'; t.textContent = s; box.append(t); }
      const g = document.createElement('div'); g.className = 'nomes'; g.style.marginBottom = '12px';
      ativos.filter(p => p.setor === s).forEach(p => {
        const st = statusTxt(ultimos[p.nome], p);
        const b = document.createElement('button'); b.type = 'button'; b.className = 'nome ' + st.c; b.disabled = !redeOk;
        b.innerHTML = '<span></span><small></small>'; b.firstChild.textContent = p.nome; b.lastChild.textContent = redeOk ? st.t : '—';
        b.onclick = () => abrePessoa(p);
        g.append(b);
      });
      box.append(g);
    });
    if (!ativos.length) box.innerHTML = '<p class="hint">Nenhum funcionário cadastrado nesta loja.</p>';
    // "É você?": o último nome usado neste celular aparece em destaque
    const eu = ativos.find(p => p.nome === ultimoNome());
    $('voce').hidden = !eu || !redeOk;
    $('lista-tit').textContent = eu && redeOk ? 'Ou escolha outro nome' : 'Toque no seu nome';
    if (eu) {
      const st = statusTxt(ultimos[eu.nome], eu);
      $('voce-ini').textContent = eu.nome.trim().charAt(0).toUpperCase();
      $('voce-nome').textContent = eu.nome; $('voce-st').textContent = st.t; $('voce-st').className = 'st ' + st.c;
      $('voce').onclick = () => abrePessoa(eu);
    }
  }

  function abrePessoa(p) {
    atual = p;
    try { localStorage.setItem('ponto-ultimo-nome-' + LOJA, p.nome); localStorage.setItem('ponto-ultimo-nome', p.nome); } catch (e) {}
    $('tela-nomes').hidden = true; $('tela-ok').hidden = true; $('tela-pessoa').hidden = false;
    $('p-nome').textContent = p.nome;
    const plano = planoAtual(p), escala = plano.horario;
    $('p-escala').textContent = escala ? 'Sua escala hoje: ' + escala[0] + ' às ' + escala[1] + (escala[1] <= escala[0] ? ' (dia seguinte)' : '') + (plano.intervalo ? ' · intervalo: ' + plano.intervalo.join(' às ') : '') + (plano.excecao ? ' · escala ajustada para hoje' : '') : 'Sem turno previsto para hoje. Se for trabalhar, confirme com o gestor.';
    const lembrete = $('p-intervalo-aviso');
    const horario=regraInicio?.horarios[p.nome],folga=regraInicio?.folgas?.includes(p.nome);lembrete.hidden=!horario&&!folga;lembrete.textContent=folga?'Hoje consta folga no quadro de intervalos. Se houve mudança, confirme com o gestor.':horario?'Seu intervalo de hoje começa às '+horario+'. Tolerância: '+regraInicio.tolerancia+' minutos. Registre a saída e a volta.':'';

    const ult = ultimos[p.nome], st = statusTxt(ult, p);
    $('p-hoje').innerHTML = ''; const s = document.createElement('span'); s.textContent = st.t; $('p-hoje').append(s);
    const box = $('p-acoes'); box.innerHTML = '';
    proximas(ult).forEach(a => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'acao ' + a; b.textContent = NOME_ACAO[a];
      b.onclick = () => bater(a, b);
      box.append(b);
    });
    const L = CFG.lojas[LOJA];
    const im = plano.intervaloMin;
    if (ult && ult.acao === 'saida_intervalo') {
      const volta = ult.ts + im * 60000, falta = Math.round((volta - Date.now()) / 60000);
      $('p-dica').innerHTML = '';
      const d = document.createElement('div'); d.className = 'notice ' + (falta < 0 ? 'err' : 'okn');
      d.textContent = falta >= 0 ? 'Intervalo de ' + im + ' min · volta às ' + hm(volta) + ' (faltam ' + falta + ' min)' : 'Intervalo de ' + im + ' min · era para voltar às ' + hm(volta) + ' (passou ' + (-falta) + ' min)';
      $('p-dica').append(d);
    } else $('p-dica').textContent = proximas(ult).includes('saida_intervalo') ? (plano.intervalo ? 'Intervalo previsto: ' + plano.intervalo.join(' às ') + ' (' + im + ' min).' : 'Intervalo de ' + im + ' min, a partir das ' + (L.intervalo_a_partir || '17:00') + ', alternando com a equipe.') : '';
    window.scrollTo(0, 0);
  }

  async function bater(acao, btn) {
    if (!await confirmaRegistro(acao)) return;
    document.querySelectorAll('#p-acoes button').forEach(b => b.disabled = true);
    btn.textContent = 'Registrando…';
    try {
      const r = await api('bater', { loja: LOJA, nome: atual.nome, acao, aparelho });
      if (!r.ok) {
        if (r.j.erro === 'rede') { redeOk = false; volta(); aviso('err', '<div><b>Você não está no Wi-Fi autorizado.</b>Conecte no Wi-Fi do ' + (CFG.lojas[LOJA].rede_nome || CFG.lojas[LOJA].nome) + ' e tente de novo.<br><button type="button">Tentar de novo</button></div>'); return; }
        alert(r.j.detalhe || 'Não deu certo. Tente de novo.'); abrePessoa(atual); return;
      }
      ultimos[atual.nome] = { acao, ts: r.j.ts };
      $('tela-pessoa').hidden = true; $('tela-ok').hidden = false;
      $('ok-txt').textContent = NOME_ACAO[acao] + ' registrada';
      const regra=r.j.intervalo, alerta=$('ok-alerta-intervalo');
      alerta.hidden=!regra;
      alerta.textContent=regra?(regra.fora==='atrasado'?'Atenção: seu intervalo estava previsto para '+regra.inicio+'. Você saiu com '+regra.atraso+' minutos de atraso. Tolerância: '+regra.tolerancia+' min.':regra.fora==='antecipado'?'Atenção: intervalo iniciado '+regra.antecipado+' minutos antes do horário previsto ('+regra.inicio+').':'Intervalo iniciado dentro da tolerância de '+regra.tolerancia+' minutos.'):'';
      alerta.className=regra?.fora==='no_horario'?'okmsg':'flag';
      $('ok-hora').textContent = hm(r.j.ts);
      $('ok-nome').textContent = acao === 'saida_intervalo' ? atual.nome + ' · volte às ' + hm(r.j.ts + planoAtual(atual).intervaloMin * 60000) : atual.nome;
      $('ok-desfazer').disabled = false; $('ok-desfazer').textContent = 'Errei · desfazer';
      if (navigator.vibrate) navigator.vibrate(60);
    } catch (e) { alert('Sem internet. Confira o Wi-Fi e tente de novo.'); abrePessoa(atual); }
  }

  $('ok-desfazer').onclick = async () => {
    const b = $('ok-desfazer'); b.disabled = true; b.textContent = 'Desfazendo…';
    const r = await api('desfazer', { loja: LOJA, aparelho }).catch(() => ({ ok: false, j: {} }));
    if (!r.ok) { b.textContent = r.j.detalhe || 'Não deu. Fale com o gerente.'; return; }
    await carregaEstado(); abrePessoa(atual);
  };
  $('ok-fim').onclick = volta;
  $('p-voltar').onclick = volta;
  function volta() { $('tela-ok').hidden = true; $('tela-pessoa').hidden = true; $('tela-nomes').hidden = false; desenhaNomes(); window.scrollTo(0, 0); }

  async function carregaEstado() {
    aviso('', 'Conferindo a internet…');
    try {
      const r = await api('estado?loja=' + LOJA);
      if (!r.ok) throw new Error();
      regraInicio=r.j.regraInicio||null;redeOk = r.j.redeOk; ultimos = r.j.ultimos || {};
      if (redeOk && Array.isArray(r.j.equipe)) {
        CFG.lojas[LOJA].equipe = r.j.equipe;
        if (atual) atual = r.j.equipe.find(p => p.nome === atual.nome) || null;
        if (!atual && !$('tela-pessoa').hidden) volta();
      }
      if (redeOk) aviso('okn', '<div><b>✓ Conectado no Wi-Fi do ' + (CFG.lojas[LOJA].rede_nome || CFG.lojas[LOJA].nome) + '</b></div>');
      else if (!r.j.lojaTemRede) aviso('err', '<div><b>Ponto ainda não liberado.</b>O gerente precisa liberar a internet desta loja primeiro.<br><button type="button">Tentar de novo</button></div>');
      else aviso('err', '<div><b>Você não está no Wi-Fi autorizado.</b>Desligue os dados móveis, conecte no Wi-Fi do ' + (CFG.lojas[LOJA].rede_nome || CFG.lojas[LOJA].nome) + ' e toque em Tentar de novo.<br><button type="button">Tentar de novo</button></div>');
    } catch (e) { redeOk = false; aviso('err', '<div><b>Sem conexão com o ponto.</b>Confira a internet.<br><button type="button">Tentar de novo</button></div>'); }
    if (!$('tela-nomes').hidden) desenhaNomes();
    if (!$('tela-pessoa').hidden && atual) {
      if (redeOk) abrePessoa(atual);
      else volta();
    }
  }

  let confirmando = false;
  function confirmaRegistro(acao) {
    if (confirmando) return Promise.resolve(false);
    confirmando = true;
    const modal = $('confirmacao');
    $('conf-nome').textContent = atual.nome;
    $('conf-titulo').textContent = NOME_ACAO[acao] + ' de';
    $('conf-sim').textContent = 'Sou eu · confirmar';
    $('conf-sim').className = 'acao ' + acao;
    return new Promise(resolve => {
      let concluido = false;
      const fim = valor => {
        if (concluido) return; concluido = true; confirmando = false;
        modal.removeEventListener('cancel', cancela); modal.removeEventListener('close', fecha);
        modal.close(); resolve(valor);
      };
      const cancela = e => { e.preventDefault(); fim(false); }, fecha = () => fim(false);
      $('conf-sim').onclick = () => fim(true); $('conf-nao').onclick = () => fim(false);
      modal.addEventListener('cancel', cancela); modal.addEventListener('close', fecha);
      modal.showModal();
    });
  }
  fetch('config.json?v=' + Date.now(), { cache: 'no-store' }).then(r => r.json()).then(c => {
    CFG = c; SRV = c.servico.replace(/\/+$/, '');
    if (!CFG.lojas[LOJA]) { aviso('err', 'Loja não encontrada no link.'); return; }
    try { localStorage.setItem('ponto-loja', LOJA); } catch (e) {}
    $('titulo').textContent = CFG.lojas[LOJA].nome;
    document.title = 'Ponto · ' + CFG.lojas[LOJA].nome;
    desenhaNomes(); carregaEstado();
  }).catch(() => aviso('err', 'Não consegui abrir o ponto. Confira a internet e recarregue.'));
  document.addEventListener('visibilitychange', () => { if (!document.hidden && CFG) carregaEstado(); });
})();
</script>
</body>
