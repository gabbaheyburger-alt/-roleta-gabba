<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ponto · Grupo Gabba</title>
<meta name="theme-color" content="#111111">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Ponto da equipe: barra preta com relógio; aviso da internet; nomes por setor; ao tocar no nome, botões grandes da próxima marcação; tela de confirmação com desfazer */
:root {
  --ink: #111111; --ink-2: #2b2b2b; --cream: #f5f2dc; --page: #f3f2ee; --panel: #ffffff;
  --line: #e4e2db; --line-2: #d3d0c6; --muted: #6e6b63; --soft: #f7f6f2;
  --red: #c8102e; --red-soft: #fcecee; --amber: #b87700; --amber-soft: #fdf3dc; --green: #2f7d45; --green-soft: #e7f3ea;
  --font: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--page); color: var(--ink); }
body { font-family: var(--font); font-size: 16px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
.topbar { background: var(--ink); color: var(--cream); padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px 18px; }
.topbar .in { max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 14px; }
.topbar img { height: 54px; width: auto; display: block; }
.topbar .sep { width: 1px; align-self: stretch; background: rgba(245,242,220,.22); }
.topbar .eyebrow { font-size: .68rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: rgba(245,242,220,.62); }
.topbar h1 { margin: 2px 0 0; font-size: 1.22rem; font-weight: 700; color: var(--cream); }
.relogio { margin-left: auto; text-align: right; font-variant-numeric: tabular-nums; }
.relogio b { display: block; font-size: 1.6rem; font-weight: 800; letter-spacing: -.02em; line-height: 1; }
.relogio span { font-size: .75rem; color: rgba(245,242,220,.7); }
.main { max-width: 560px; margin: 0 auto; padding: 16px 16px 60px; display: flex; flex-direction: column; gap: 14px; }
.notice { border-radius: 12px; padding: 12px 14px; font-size: .95rem; border: 1px solid #ead9a6; background: #fbf5e2; color: #5b4810; display: flex; gap: 10px; align-items: flex-start; }
.notice.err { border-color: #efc3c9; background: #fcf0f1; color: #7a1222; }
.notice.okn { border-color: #bfe0c8; background: var(--green-soft); color: #1d5130; }
.notice b { display: block; }
.notice button { margin-top: 8px; font: 700 .9rem var(--font); border-radius: 10px; border: 1px solid currentColor; background: transparent; color: inherit; padding: 8px 12px; cursor: pointer; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.label { font-size: .78rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.hint { margin: 0; font-size: .86rem; color: var(--muted); }
.nomes { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.nome { font: 600 1.02rem var(--font); min-height: 62px; border-radius: 12px; border: 1px solid var(--line-2); background: #fff; color: var(--ink); cursor: pointer; text-align: left; padding: 10px 12px; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
.nome small { font-size: .76rem; font-weight: 600; color: var(--muted); }
.nome.dentro small { color: var(--green); }
.nome.pausa small { color: var(--amber); }
.nome:disabled { opacity: .45; }
.pessoa { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.pessoa h2 { margin: 0; font-size: 1.5rem; font-weight: 800; letter-spacing: -.02em; }
.voltar { font: 600 .9rem var(--font); border: 1px solid var(--line-2); background: #fff; border-radius: 10px; padding: 8px 12px; cursor: pointer; color: var(--ink); }
.hoje { display: flex; flex-wrap: wrap; gap: 6px; }
.hoje span { font-size: .82rem; font-weight: 600; background: var(--soft); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font-variant-numeric: tabular-nums; }
.acoes { display: grid; gap: 10px; }
.acao { font: 800 1.25rem var(--font); min-height: 76px; border-radius: 14px; border: none; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; letter-spacing: -.01em; }
.acao.entrada { background: var(--green); }
.acao.saida_intervalo, .acao.volta_intervalo { background: var(--amber); }
.acao.saida { background: var(--ink); }
.acao.sec { background: #fff; color: var(--ink); border: 1px solid var(--line-2); font-size: 1rem; min-height: 56px; }
.acao:disabled { opacity: .5; }
.ok-card { text-align: center; padding: 26px 16px; }
.ok-card .check { width: 72px; height: 72px; border-radius: 50%; background: var(--green); color: #fff; display: flex; align-items: center; justify-content: center; margin: 0 auto 10px; font-size: 2.2rem; font-weight: 800; }
.ok-card h2 { margin: 0; font-size: 1.4rem; }
.ok-card .hora { font-size: 2.6rem; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; margin: 4px 0; }
.ok-card p { margin: 0 0 14px; color: var(--muted); }
.rodape { text-align: center; font-size: .8rem; color: var(--muted); }
</style>
</head>
<body>
<header class="topbar"><div class="in">
  <img src="../pedidos/logo-grupo-gabba.svg" alt="Grupo Gabba">
  <div class="sep"></div>
  <div><div class="eyebrow">Ponto da equipe</div><h1 id="titulo">Gabba Burger</h1></div>
  <div class="relogio"><b id="hora">--:--</b><span id="data"></span></div>
</div></header>

<main class="main">
  <div class="notice" id="aviso">Conferindo a internet…</div>

  <section class="panel" id="tela-nomes">
    <div class="label">Quem é você?</div>
    <div id="grupos"></div>
    <p class="hint">Use o seu próprio celular, conectado no Wi-Fi da loja.</p>
  </section>

  <section class="panel" id="tela-pessoa" hidden>
    <div class="pessoa"><h2 id="p-nome"></h2><button class="voltar" id="p-voltar" type="button">‹ Trocar</button></div>
    <div class="hoje" id="p-hoje"></div>
    <div class="acoes" id="p-acoes"></div>
    <p class="hint" id="p-dica"></p>
  </section>

  <section class="panel ok-card" id="tela-ok" hidden>
    <div class="check">✓</div>
    <h2 id="ok-txt"></h2>
    <div class="hora" id="ok-hora"></div>
    <p id="ok-nome"></p>
    <div class="acoes"><button class="acao sec" id="ok-desfazer" type="button">Errei · desfazer</button><button class="acao saida" id="ok-fim" type="button">Pronto</button></div>
  </section>

  <p class="rodape">Controle interno do Grupo Gabba. Dúvida ou erro no registro: fale com o gerente.</p>
</main>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const LOJA = (new URLSearchParams(location.search).get('loja') || 'gabba').toLowerCase();
  const NOME_ACAO = { entrada: 'Entrada', saida_intervalo: 'Saída para intervalo', volta_intervalo: 'Volta do intervalo', saida: 'Saída' };
  const ICONE = { entrada: '→', saida_intervalo: '☕', volta_intervalo: '↩', saida: '⏏' };
  const pad = n => String(n).padStart(2, '0');
  const hm = ts => { const d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
  let CFG = null, SRV = '', ultimos = {}, redeOk = false, atual = null;

  // aparelho: identifica este celular (sem dados pessoais), para o gerente ver se alguém bateu por outra pessoa
  let aparelho = '';
  try { aparelho = localStorage.getItem('ponto-aparelho') || ''; if (!aparelho) { aparelho = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2)).slice(0, 18); localStorage.setItem('ponto-aparelho', aparelho); } } catch (e) { aparelho = 'sem-memoria-' + String(Math.random()).slice(2, 10); }

  function relogio() { const d = new Date(); $('hora').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes()); $('data').textContent = d.toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: '2-digit' }); }
  relogio(); setInterval(relogio, 10000);

  function aviso(tipo, html) { const a = $('aviso'); a.className = 'notice' + (tipo ? ' ' + tipo : ''); a.innerHTML = html; const b = a.querySelector('button'); if (b) b.onclick = carregaEstado; }

  async function api(rota, corpo) {
    const op = corpo ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corpo) } : {};
    const r = await fetch(SRV + '/ponto/' + rota, op);
    const j = await r.json().catch(() => ({}));
    return { ok: r.ok, status: r.status, j };
  }

  function proximas(ult) {
    if (!ult || ult.acao === 'saida') return ['entrada'];
    if (ult.acao === 'saida_intervalo') return ['volta_intervalo'];
    return ['saida_intervalo', 'saida'];
  }
  function statusTxt(ult) {
    if (!ult) return { t: 'Ainda não bateu hoje', c: '' };
    if (ult.acao === 'saida') return { t: 'Saiu às ' + hm(ult.ts), c: '' };
    if (ult.acao === 'saida_intervalo') return { t: 'Intervalo · volta às ' + hm(ult.ts + ((CFG && CFG.lojas[LOJA].intervalo_min) || 30) * 60000), c: 'pausa' };
    return { t: 'Na loja desde ' + hm(ult.ts), c: 'dentro' };
  }

  function desenhaNomes() {
    const L = CFG.lojas[LOJA], box = $('grupos'); box.innerHTML = '';
    const setores = [...new Set(L.equipe.map(p => p.setor))];
    setores.forEach(s => {
      const t = document.createElement('div'); t.className = 'hint'; t.style.cssText = 'font-weight:700;color:var(--ink-2);margin:8px 0 6px'; t.textContent = s; box.append(t);
      const g = document.createElement('div'); g.className = 'nomes';
      L.equipe.filter(p => p.setor === s && p.ativo !== false).forEach(p => {
        const st = statusTxt(ultimos[p.nome]);
        const b = document.createElement('button'); b.type = 'button'; b.className = 'nome ' + st.c; b.disabled = !redeOk;
        b.innerHTML = '<span></span><small></small>'; b.firstChild.textContent = p.nome; b.lastChild.textContent = redeOk ? st.t : '—';
        b.onclick = () => abrePessoa(p);
        g.append(b);
      });
      box.append(g);
    });
  }

  function abrePessoa(p) {
    atual = p;
    try { localStorage.setItem('ponto-ultimo-nome', p.nome); } catch (e) {}
    $('tela-nomes').hidden = true; $('tela-ok').hidden = true; $('tela-pessoa').hidden = false;
    $('p-nome').textContent = p.nome;
    const ult = ultimos[p.nome], st = statusTxt(ult);
    $('p-hoje').innerHTML = ''; const s = document.createElement('span'); s.textContent = st.t; $('p-hoje').append(s);
    const box = $('p-acoes'); box.innerHTML = '';
    proximas(ult).forEach(a => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'acao ' + a; b.textContent = ICONE[a] + '  ' + NOME_ACAO[a];
      b.onclick = () => bater(a, b);
      box.append(b);
    });
    const L = CFG.lojas[LOJA];
    const im = L.intervalo_min || 30;
    if (ult && ult.acao === 'saida_intervalo') {
      const volta = ult.ts + im * 60000, falta = Math.round((volta - Date.now()) / 60000);
      $('p-dica').innerHTML = '';
      const d = document.createElement('div'); d.className = 'notice ' + (falta < 0 ? 'err' : 'okn');
      d.textContent = falta >= 0 ? 'Intervalo de ' + im + ' min · volta às ' + hm(volta) + ' (faltam ' + falta + ' min)' : 'Intervalo de ' + im + ' min · era para voltar às ' + hm(volta) + ' (passou ' + (-falta) + ' min)';
      $('p-dica').append(d);
    } else $('p-dica').textContent = proximas(ult).includes('saida_intervalo') ? 'Intervalo de ' + im + ' min, a partir das ' + (L.intervalo_a_partir || '17:00') + ', alternando com a equipe.' : '';
    window.scrollTo(0, 0);
  }

  async function bater(acao, btn) {
    document.querySelectorAll('#p-acoes button').forEach(b => b.disabled = true);
    btn.textContent = 'Registrando…';
    try {
      const r = await api('bater', { loja: LOJA, nome: atual.nome, acao, aparelho });
      if (!r.ok) {
        if (r.j.erro === 'rede') { redeOk = false; volta(); aviso('err', '<div><b>Você não está no Wi-Fi da loja.</b>Conecte no Wi-Fi do ' + CFG.lojas[LOJA].nome + ' e tente de novo.<br><button type="button">Tentar de novo</button></div>'); return; }
        alert(r.j.detalhe || 'Não deu certo. Tente de novo.'); abrePessoa(atual); return;
      }
      ultimos[atual.nome] = { acao, ts: r.j.ts };
      $('tela-pessoa').hidden = true; $('tela-ok').hidden = false;
      $('ok-txt').textContent = NOME_ACAO[acao] + ' registrada';
      $('ok-hora').textContent = hm(r.j.ts);
      $('ok-nome').textContent = acao === 'saida_intervalo' ? atual.nome + ' · volte às ' + hm(r.j.ts + (CFG.lojas[LOJA].intervalo_min || 30) * 60000) : atual.nome;
      $('ok-desfazer').disabled = false; $('ok-desfazer').textContent = 'Errei · desfazer';
      if (navigator.vibrate) navigator.vibrate(60);
    } catch (e) { alert('Sem internet. Confira o Wi-Fi e tente de novo.'); abrePessoa(atual); }
  }

  $('ok-desfazer').onclick = async () => {
    const b = $('ok-desfazer'); b.disabled = true; b.textContent = 'Desfazendo…';
    const r = await api('desfazer', { loja: LOJA, aparelho }).catch(() => ({ ok: false, j: {} }));
    if (!r.ok) { b.textContent = r.j.detalhe || 'Não deu. Fale com o gerente.'; return; }
    await carregaEstado(); abrePessoa(atual);
  };
  $('ok-fim').onclick = volta;
  $('p-voltar').onclick = volta;
  function volta() { $('tela-ok').hidden = true; $('tela-pessoa').hidden = true; $('tela-nomes').hidden = false; desenhaNomes(); }

  async function carregaEstado() {
    aviso('', 'Conferindo a internet…');
    try {
      const r = await api('estado?loja=' + LOJA);
      if (!r.ok) throw new Error();
      redeOk = r.j.redeOk; ultimos = r.j.ultimos || {};
      if (redeOk) aviso('okn', '<div><b>✓ Conectado na internet do ' + CFG.lojas[LOJA].nome + '</b>Toque no seu nome.</div>');
      else if (!r.j.lojaTemRede) aviso('err', '<div><b>Ponto ainda não liberado.</b>O gerente precisa liberar a internet desta loja primeiro.<br><button type="button">Tentar de novo</button></div>');
      else aviso('err', '<div><b>Você não está no Wi-Fi da loja.</b>Desligue os dados móveis, conecte no Wi-Fi do ' + CFG.lojas[LOJA].nome + ' e toque em Tentar de novo.<br><button type="button">Tentar de novo</button></div>');
    } catch (e) { redeOk = false; aviso('err', '<div><b>Sem conexão com o ponto.</b>Confira a internet.<br><button type="button">Tentar de novo</button></div>'); }
    if (!$('tela-nomes').hidden) desenhaNomes();
  }

  fetch('config.json?v=' + Date.now(), { cache: 'no-store' }).then(r => r.json()).then(c => {
    CFG = c; SRV = c.servico.replace(/\/+$/, '');
    if (!CFG.lojas[LOJA]) { aviso('err', 'Loja não encontrada no link.'); return; }
    $('titulo').textContent = CFG.lojas[LOJA].nome;
    desenhaNomes(); carregaEstado();
  }).catch(() => aviso('err', 'Não consegui abrir o ponto. Confira a internet e recarregue.'));
  document.addEventListener('visibilitychange', () => { if (!document.hidden && CFG) carregaEstado(); });
})();
</script>
</body>
</html>
