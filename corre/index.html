<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Corre, Gabba!</title>
<meta name="theme-color" content="#0d0a09">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow:wght@400;600;700;800&display=swap">
<style>
/* Layout: corrida em tela cheia; placar no topo, toque em qualquer lugar para pular */
:root {
  --bg: #0d0a09;
  --surface: #221a17;
  --line: #3b2e29;
  --fg: #f6ece2;
  --muted: #b5a397;
  --red: #e8102e;
  --red-deep: #9c0b1f;
  --mustard: #f2b632;
  --cream: #f3e6cc;
  --ok: #6fbf73;
  --display: 'Bungee', Impact, 'Arial Black', sans-serif;
  --body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
* { touch-action: manipulation; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--fg); font-family: var(--body); user-select: none; -webkit-user-select: none; overscroll-behavior: none; }
[hidden] { display: none !important; }
#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

.hud { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 10px); left: 12px; right: 12px; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; pointer-events: none; z-index: 2; }
.chip { background: rgba(13,10,9,.72); border: 1px solid rgba(255,255,255,.1); border-radius: 12px; padding: 6px 10px; }
.chip small { display: block; font-size: .58rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.chip b { font-family: var(--display); font-weight: 400; font-size: 1.2rem; line-height: 1; font-variant-numeric: tabular-nums; }
.chip.main b { color: var(--mustard); font-size: 1.5rem; }
.right { display: flex; gap: 6px; }
.back { pointer-events: auto; color: var(--fg); background: rgba(13,10,9,.72); border: 1px solid rgba(255,255,255,.1); border-radius: 10px; padding: 7px 10px; font-weight: 700; font-size: .85rem; text-decoration: none; }

.banner { position: fixed; top: 30%; left: 50%; transform: translateX(-50%); font-family: var(--display); font-size: clamp(2rem, 12vw, 3.4rem); color: var(--mustard); text-shadow: 0 3px 0 #000, 0 0 24px rgba(242,182,50,.5); pointer-events: none; z-index: 3; animation: pop .9s ease-out forwards; white-space: nowrap; }
@keyframes pop { 0% { opacity: 0; transform: translateX(-50%) scale(.6); } 20% { opacity: 1; transform: translateX(-50%) scale(1.1); } 70% { opacity: 1; transform: translateX(-50%) scale(1); } 100% { opacity: 0; transform: translateX(-50%) translateY(-20px); } }

.overlay { position: fixed; inset: 0; background: rgba(13,10,9,.9); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; z-index: 5; overflow-y: auto; }
.overlay img { width: 150px; height: auto; transform: scaleX(-1); filter: drop-shadow(0 8px 18px rgba(232,16,46,.45)); animation: bob 1.2s ease-in-out infinite; }
@keyframes bob { 50% { transform: scaleX(-1) translateY(-8px) rotate(3deg); } }
.overlay h1 { font-family: var(--display); font-weight: 400; font-size: clamp(2.2rem, 11vw, 3rem); line-height: .95; margin: 0; color: var(--red); text-shadow: 0 0 22px rgba(232,16,46,.45); }
.overlay h1 span { color: var(--cream); }
.overlay p { margin: 0; color: var(--muted); max-width: 32ch; }
.overlay p strong { color: var(--fg); }
.btn { font-family: var(--display); font-size: 1.3rem; letter-spacing: .04em; background: var(--red); color: var(--cream); border: none; border-radius: 14px; padding: 14px 28px; cursor: pointer; box-shadow: 0 5px 0 var(--red-deep); }
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--red-deep); }
.link { color: var(--muted); border: 1px solid var(--line); border-radius: 10px; padding: 9px 14px; font-weight: 700; font-size: .9rem; text-decoration: none; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--mustard); outline-offset: 2px; }
.big { font-family: var(--display); font-size: 3rem; line-height: 1; color: var(--mustard); }
.record { color: var(--ok); font-weight: 700; }
@media (prefers-reduced-motion: reduce) { .overlay img { animation: none; } .banner { animation-duration: .01s; } }
</style>
</head>
<body>
<canvas id="game" aria-label="Corre, Gabba! Toque para pular"></canvas>

<div class="hud">
  <a class="back" href="../jogos/">‹ Jogos</a>
  <div class="right">
    <div class="chip"><small>Batatas</small><b id="fries">0</b></div>
    <div class="chip"><small>Recorde</small><b id="best">0</b></div>
    <div class="chip main"><small>Pontos</small><b id="score">0</b></div>
  </div>
</div>

<div class="overlay" id="start">
  <img src="mascote.png" alt="Mascote do Gabba Hey Burger">
  <h1>Corre, <span>Gabba!</span></h1>
  <p><strong>Toque na tela para pular.</strong> Toque de novo no ar para dar um pulo duplo.</p>
  <p>Desvie das caixas de som, das pimentas e dos cones. Pegue as batatas!</p>
  <button class="btn" id="play" type="button">CORRER</button>
  <a class="link" href="../jogos/">Escolher outro jogo</a>
</div>

<div class="overlay" id="over" hidden>
  <img src="mascote.png" alt="">
  <h1>Ops, <span>trombou!</span></h1>
  <div class="big" id="final">0</div>
  <p id="final-msg">pontos</p>
  <button class="btn" id="again" type="button">CORRER DE NOVO</button>
  <a class="link" href="../jogos/">Escolher outro jogo</a>
</div>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const cv = $('game'), ctx = cv.getContext('2d');
  const STORE = 'corre-gabba-v1';
  let best = 0;
  try { best = Number(JSON.parse(localStorage.getItem(STORE) || '{}').best) || 0; } catch (e) {}
  $('best').textContent = best;

  const img = new Image(); img.src = 'mascote.png';
  let W = 0, H = 0, dpr = 1, U = 1, GROUND = 0;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    U = Math.min(W, H * 0.62) / 100;
    GROUND = H * 0.78;
    makeStars();
  }

  /* ---------- Estado ---------- */
  const G = { x: 0, y: 0, vy: 0, jumps: 0, onGround: true, run: 0, squash: 0, dead: false, rot: 0, vx: 0 };
  let obs = [], items = [], parts = [], lines = [], stars = [];
  let jumpBuf = 0, obsDist = 0, speed = 0, dist = 0, score = 0, fries = 0, running = false, countdown = 0, nextObs = 0, nextItem = 0, shake = 0, flash = 0, slow = 1, t = 0, lastMilestone = 0, stepT = 0;
  let farOff = 0, midOff = 0, poleOff = 0, groundOff = 0;
  const SPR_H = () => U * 30;
  const SPR_W = () => SPR_H() * (img.naturalWidth ? img.naturalWidth / img.naturalHeight : 0.7);

  function makeStars() { stars = []; for (let i = 0; i < 60; i++) stars.push({ x: Math.random(), y: Math.random() * 0.5, r: Math.random() * 1.3 + 0.3, tw: Math.random() * 6 }); }
  window.addEventListener('resize', resize); resize();

  function reset() {
    G.x = Math.max(W * 0.2, U * 16); G.y = GROUND; G.vy = 0; G.jumps = 0; G.onGround = true; G.squash = 0; G.dead = false; G.rot = 0; G.vx = 0;
    obs = []; items = []; parts = []; lines = [];
    speed = U * 50; dist = 0; score = 0; fries = 0; nextObs = U * 70; obsDist = 0; jumpBuf = 0; nextItem = 0.6; shake = 0; flash = 0; slow = 1; lastMilestone = 0;
    $('score').textContent = '0'; $('fries').textContent = '0';
  }

  function banner(txt) { const b = document.createElement('div'); b.className = 'banner'; b.textContent = txt; document.body.append(b); setTimeout(() => b.remove(), 950); }

  /* ---------- Pulo ---------- */
  const GRAV = 215, JUMP_V = 104, JUMP2_V = 88;   // pulo de ~0,97 s no ar
  function jump() {
    if (!running || countdown > 0) return;
    if (!G.onGround && G.jumps >= 2) { jumpBuf = 0.15; return; }
    if (G.onGround) { G.vy = -U * JUMP_V; G.onGround = false; G.jumps = 1; G.squash = -0.16; sfx(420, 760, 0.12); dust(G.x, GROUND, 6); }
    else if (G.jumps < 2) { G.vy = -U * JUMP2_V; G.jumps = 2; sfx(560, 1000, 0.12); ring(G.x, G.y - SPR_H() * 0.2); }
  }
  cv.addEventListener('pointerdown', e => { e.preventDefault(); initAudio(); jump(); });
  window.addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); jump(); } });

  /* ---------- Partículas ---------- */
  function dust(x, y, n) { for (let i = 0; i < n; i++) parts.push({ x: x - Math.random() * U * 4, y: y - Math.random() * U, vx: -U * (10 + Math.random() * 30), vy: -U * Math.random() * 16, life: 0.45, max: 0.45, size: U * (1 + Math.random() * 1.6), color: '120,100,90', kind: 'dust' }); }
  function sparks(x, y, color, n) { for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, s = U * (20 + Math.random() * 40); parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.5, max: 0.5, size: U * 1.1, color, kind: 'spark' }); } }
  function ring(x, y) { parts.push({ x, y, vx: 0, vy: 0, life: 0.35, max: 0.35, size: U * 4, color: '243,230,204', kind: 'ring' }); }

  /* ---------- Obstáculos e itens ---------- */
  const TYPES = { amp: { w: 15, h: 14 }, pimenta: { w: 8, h: 19 }, cone: { w: 12, h: 13 }, amp2: { w: 15, h: 27 } };
  function spawnObs() {
    const level = dist / (U * 1000);
    const pool = level < 1.6 ? ['amp', 'pimenta', 'cone'] : ['amp', 'pimenta', 'cone', 'amp', 'cone', 'amp2'];
    const k = pool[Math.floor(Math.random() * pool.length)];
    obs.push({ kind: k, x: W + U * 10, w: TYPES[k].w * U, h: TYPES[k].h * U });
    if (level > 3 && k !== 'amp2' && Math.random() < 0.25) {
      const k2 = ['cone', 'pimenta'][Math.floor(Math.random() * 2)];
      obs.push({ kind: k2, x: W + U * 10 + TYPES[k].w * U + U * 3, w: TYPES[k2].w * U, h: TYPES[k2].h * U });
    }
    // tempo no ar + tempo para reagir depois de cair, convertido em distância
    const air = 2 * JUMP_V / GRAV;
    const react = Math.max(0.42, 0.75 - level * 0.05);
    nextObs = speed * (air + react) + speed * Math.random() * 0.9 + (k === 'amp2' ? speed * 0.3 : 0);
  }
  function spawnItem() {
    const pattern = Math.random();
    const base = [U * 6, U * 22, U * 38][Math.floor(Math.random() * 3)];
    const n = 2 + Math.floor(Math.random() * 3);
    for (let i = 0; i < n; i++) {
      const arc = pattern < 0.4 ? Math.sin(i / (n - 1) * Math.PI) * U * 12 : 0;
      items.push({ x: W + U * 10 + i * U * 9, y: GROUND - base - arc, r: U * 4, got: false });
    }
    nextItem = 1.3 + Math.random() * 1.5;
  }

  /* ---------- Atualização ---------- */
  function update(rdt) {
    const dt = rdt * slow;
    t += rdt;
    if (countdown > 0) {
      const before = Math.ceil(countdown);
      countdown -= rdt;
      const after = Math.ceil(countdown);
      if (after !== before) { if (after > 0) { banner(String(after)); sfx(440, 440, 0.12); } else { banner('VAI!'); sfx(880, 880, 0.2); } }
      G.run += rdt * 4;
    } else if (running) {
      speed = Math.min(U * 120, speed + U * 1.0 * dt);
      dist += speed * dt;
      score = Math.floor(dist / (U * 10)) + fries * 10;
      $('score').textContent = score;
      const ms = Math.floor(score / 250) * 250;
      if (ms > 0 && ms > lastMilestone) { lastMilestone = ms; banner(ms + '!'); sfx(660, 1320, 0.25, 'triangle'); }

      G.vy += U * GRAV * dt; G.y += G.vy * dt;
      jumpBuf -= dt;
      if (G.y >= GROUND) { if (!G.onGround) { G.squash = 0.18; dust(G.x, GROUND, 7); sfx(160, 90, 0.06, 'sine'); } G.y = GROUND; G.vy = 0; G.onGround = true; G.jumps = 0; if (jumpBuf > 0) { jumpBuf = 0; jump(); } }
      G.run += dt * speed / (U * 5.5);
      if (G.onGround) { stepT -= dt; if (stepT <= 0) { stepT = (U * 5.5 * Math.PI) / speed; dust(G.x - SPR_W() * 0.1, GROUND, 1); } }

      obsDist += speed * dt; if (obsDist >= nextObs) { obsDist = 0; spawnObs(); }
      nextItem -= dt; if (nextItem <= 0) spawnItem();
      obs.forEach(o => { o.x -= speed * dt; });
      items.forEach(i => { i.x -= speed * dt; });
      obs = obs.filter(o => o.x + o.w > -60);
      items = items.filter(i => i.x > -60 && !i.got);

      if (speed > U * 95 && Math.random() < dt * 14) lines.push({ x: W, y: Math.random() * GROUND * 0.95, len: U * (10 + Math.random() * 20), life: 1 });

      const sw = SPR_W(), sh = SPR_H();
      const hb = { x: G.x - sw * 0.22, y: G.y - sh * 0.72, w: sw * 0.44, h: sh * 0.64 };
      for (const o of obs) {
        const ob = o.kind === 'cone' ? { x: o.x + o.w * 0.25, y: GROUND - o.h * 0.85, w: o.w * 0.5, h: o.h * 0.85 } : { x: o.x + o.w * 0.08, y: GROUND - o.h * 0.94, w: o.w * 0.84, h: o.h * 0.94 };
        if (hb.x < ob.x + ob.w && hb.x + hb.w > ob.x && hb.y < ob.y + ob.h && hb.y + hb.h > ob.y) { crash(); break; }
      }
      items.forEach(i => {
        if (i.got) return;
        if (Math.abs(i.x - G.x) < sw * 0.38 + i.r && Math.abs(i.y - (G.y - sh * 0.45)) < sh * 0.45 + i.r) {
          i.got = true; fries++; $('fries').textContent = fries; sparks(i.x, i.y, '245,197,66', 10); sfx(900, 1400, 0.08);
        }
      });
    } else if (G.dead) {
      G.vy += U * GRAV * rdt; G.y += G.vy * rdt; G.x += G.vx * rdt; G.rot += rdt * 7;
      slow = Math.min(1, slow + rdt * 1.5);
    }
    parts.forEach(p => { p.x += p.vx * dt - (running ? speed * dt * 0.3 : 0); p.y += p.vy * dt; if (p.kind !== 'ring') p.vy += U * 90 * dt; p.life -= rdt; });
    parts = parts.filter(p => p.life > 0);
    lines.forEach(l => { l.x -= speed * 2.2 * dt; l.life -= rdt * 2; });
    lines = lines.filter(l => l.life > 0 && l.x + l.len > 0);
    const s = (running && countdown <= 0) ? speed : (G.dead ? speed * 0.15 * slow : U * 14);
    farOff += s * 0.1 * dt; midOff += s * 0.45 * dt; poleOff += s * 0.75 * dt; groundOff += s * dt;
    shake *= Math.pow(0.002, rdt); flash = Math.max(0, flash - rdt * 3);
  }

  function crash() {
    running = false; G.dead = true; G.vy = -U * 70; G.vx = -U * 20; shake = U * 3.5; flash = 1; slow = 0.25;
    sparks(G.x, G.y - SPR_H() * 0.5, '232,16,46', 20);
    sfx(220, 50, 0.45, 'sawtooth');
    const rec = score > best;
    if (rec) { best = score; try { localStorage.setItem(STORE, JSON.stringify({ best })); } catch (e) {} $('best').textContent = best; }
    $('final').textContent = score;
    $('final-msg').innerHTML = 'pontos e ' + fries + (fries === 1 ? ' batata' : ' batatas') + (rec && score > 0 ? '<br><span class="record">Novo recorde!</span>' : '<br>Seu recorde: ' + best);
    setTimeout(() => { $('over').hidden = false; }, 1100);
  }

  /* ---------- Desenho: cenário ---------- */
  function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  function drawBackground() {
    const g = ctx.createLinearGradient(0, 0, 0, GROUND);
    g.addColorStop(0, '#07060a'); g.addColorStop(0.6, '#1a0b14'); g.addColorStop(1, '#3a0f14');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    stars.forEach(s => { ctx.globalAlpha = 0.4 + 0.4 * Math.sin(t * 2 + s.tw); ctx.fillStyle = '#fff'; ctx.fillRect(s.x * W, s.y * H, s.r, s.r); });
    ctx.globalAlpha = 1;
    // lua
    const mx = W * 0.78, my = H * 0.14, mr = U * 9;
    const mg = ctx.createRadialGradient(mx, my, mr * 0.5, mx, my, mr * 3);
    mg.addColorStop(0, 'rgba(243,230,204,.25)'); mg.addColorStop(1, 'rgba(243,230,204,0)');
    ctx.fillStyle = mg; ctx.fillRect(mx - mr * 3, my - mr * 3, mr * 6, mr * 6);
    ctx.fillStyle = '#f3e6cc'; ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.08)'; ctx.beginPath(); ctx.arc(mx - mr * 0.3, my - mr * 0.2, mr * 0.25, 0, Math.PI * 2); ctx.arc(mx + mr * 0.35, my + mr * 0.3, mr * 0.18, 0, Math.PI * 2); ctx.fill();

    // prédios distantes
    const bw = U * 20;
    for (let i = -1; i < W / bw + 2; i++) {
      const k = Math.floor(i + farOff / bw);
      const h = U * (26 + ((k * 37 % 7) + 7) % 7 * 7);
      const x = i * bw - (farOff % bw);
      const top = GROUND - U * 20 - h;
      ctx.fillStyle = '#140d10'; ctx.fillRect(x, top, bw - U * 1.5, h + U * 20);
      for (let wy = U * 4; wy < h - U * 4; wy += U * 7) for (let wx = U * 3; wx < bw - U * 5; wx += U * 5.5) {
        const lit = ((k * 31 + Math.round(wy / U) * 7 + Math.round(wx / U) * 3) % 5) === 0;
        if (lit) { ctx.fillStyle = 'rgba(242,182,50,.35)'; ctx.fillRect(x + wx, top + wy, U * 2.2, U * 3); }
      }
    }
    // parede de tijolo com letreiro neon
    const mw = U * 96, wallH = U * 30;
    for (let i = -1; i < W / mw + 2; i++) {
      const x = i * mw - (midOff % mw), k = Math.floor(i + midOff / mw);
      ctx.fillStyle = '#2a1715'; ctx.fillRect(x, GROUND - wallH, mw, wallH);
      for (let row = 0; row < 7; row++) {
        const y = GROUND - wallH + row * (wallH / 7);
        for (let bx = (row % 2) ? -U * 5 : 0; bx < mw; bx += U * 10) {
          ctx.fillStyle = ((row * 7 + Math.round(bx / U) + k) % 4 === 0) ? '#331c19' : '#2c1816';
          ctx.fillRect(x + bx + 1, y + 1, U * 10 - 2, wallH / 7 - 2);
        }
      }
      if (k % 2 === 0) {
        const nx = x + mw / 2, ny = GROUND - wallH * 0.55;
        const flick = Math.sin(t * 2.3 + k * 4) > -0.92;
        ctx.save();
        ctx.font = (U * 7.5) + 'px Bungee, Impact, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        if (flick) { ctx.shadowColor = '#ff1a3c'; ctx.shadowBlur = U * 5; }
        ctx.fillStyle = flick ? '#ff5c73' : '#5a1a22';
        ctx.fillText('GABBA HEY', nx, ny);
        ctx.font = (U * 4) + 'px Bungee, Impact, sans-serif';
        ctx.fillStyle = flick ? '#f3e6cc' : '#3a2a26';
        if (flick) ctx.shadowColor = '#f3e6cc';
        ctx.fillText('★ BURGER ★', nx, ny + U * 7);
        ctx.restore();
      } else {
        // porta de enrolar
        ctx.fillStyle = '#1b1b1d'; ctx.fillRect(x + mw * 0.3, GROUND - wallH * 0.7, mw * 0.4, wallH * 0.7);
        ctx.fillStyle = '#26262a'; for (let ly = GROUND - wallH * 0.7; ly < GROUND; ly += U * 2.2) ctx.fillRect(x + mw * 0.3, ly, mw * 0.4, U * 0.8);
      }
    }
    // postes com luz
    const pw = U * 70;
    for (let i = -1; i < W / pw + 2; i++) {
      const x = i * pw - (poleOff % pw) + U * 20;
      const lg = ctx.createRadialGradient(x, GROUND - U * 40, 0, x, GROUND - U * 40, U * 30);
      lg.addColorStop(0, 'rgba(255,200,120,.28)'); lg.addColorStop(1, 'rgba(255,200,120,0)');
      ctx.fillStyle = lg; ctx.beginPath(); ctx.moveTo(x - U * 2, GROUND - U * 41); ctx.lineTo(x - U * 18, GROUND); ctx.lineTo(x + U * 18, GROUND); ctx.lineTo(x + U * 2, GROUND - U * 41); ctx.fill();
      ctx.fillStyle = '#0c0b0c'; ctx.fillRect(x - U * 0.7, GROUND - U * 44, U * 1.4, U * 44);
      ctx.fillRect(x - U * 4, GROUND - U * 44, U * 5, U * 1.2);
      ctx.fillStyle = '#ffd38a'; ctx.fillRect(x - U * 4, GROUND - U * 43, U * 2.6, U * 1);
    }
    // rua e calçada
    ctx.fillStyle = '#3d302b'; ctx.fillRect(0, GROUND, W, U * 2);
    ctx.fillStyle = '#4c3d37'; const cw = U * 12; for (let x = -(groundOff % cw); x < W; x += cw) ctx.fillRect(x, GROUND, 1.5, U * 2);
    const rg = ctx.createLinearGradient(0, GROUND, 0, H);
    rg.addColorStop(0, '#191313'); rg.addColorStop(1, '#0b0909');
    ctx.fillStyle = rg; ctx.fillRect(0, GROUND + U * 2, W, H - GROUND);
    ctx.fillStyle = 'rgba(242,182,50,.7)';
    const dw = U * 18, ly = GROUND + (H - GROUND) * 0.5;
    for (let x = -(groundOff * 1.15 % dw); x < W; x += dw) ctx.fillRect(x, ly, dw * 0.5, U * 1.1);
  }

  /* ---------- Desenho: obstáculos e batatas ---------- */
  function drawObs(o) {
    const x = o.x, y = GROUND - o.h, w = o.w, h = o.h, lw = U * 0.7;
    ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.beginPath(); ctx.ellipse(x + w / 2, GROUND + U * 0.6, w * 0.6, U * 1.2, 0, 0, Math.PI * 2); ctx.fill();
    if (o.kind === 'amp' || o.kind === 'amp2') {
      const n = o.kind === 'amp2' ? 2 : 1, bh = h / n;
      for (let i = 0; i < n; i++) {
        const by = y + i * bh;
        rr(x, by, w, bh - U * 0.4, U * 1.2); ctx.fillStyle = '#1e1e20'; ctx.fill(); ctx.lineWidth = lw; ctx.strokeStyle = '#000'; ctx.stroke();
        rr(x + U * 1.2, by + U * 3, w - U * 2.4, bh - U * 4.4, U * 0.8); ctx.fillStyle = '#2b2b2f'; ctx.fill();
        ctx.fillStyle = '#18181a';
        for (let gy = by + U * 3.8; gy < by + bh - U * 1.6; gy += U * 1.4) for (let gx = x + U * 2; gx < x + w - U * 1.6; gx += U * 1.4) ctx.fillRect(gx, gy, U * 0.6, U * 0.6);
        ctx.fillStyle = '#e8102e'; ctx.fillRect(x + U * 1.2, by + U * 0.9, w - U * 2.4, U * 1.4);
        ctx.fillStyle = '#d9d9d9'; for (let kx = 0; kx < 3; kx++) { ctx.beginPath(); ctx.arc(x + w - U * 2 - kx * U * 2, by + U * 1.6, U * 0.45, 0, Math.PI * 2); ctx.fill(); }
      }
    } else if (o.kind === 'pimenta') {
      const neck = w * 0.45;
      ctx.lineWidth = lw; ctx.strokeStyle = '#000';
      rr(x, y + h * 0.32, w, h * 0.68, U * 2); ctx.fillStyle = '#c4161c'; ctx.fill(); ctx.stroke();
      rr(x + (w - neck) / 2, y + h * 0.12, neck, h * 0.24, U * 0.6); ctx.fillStyle = '#c4161c'; ctx.fill(); ctx.stroke();
      rr(x + (w - neck * 1.1) / 2, y, neck * 1.1, h * 0.14, U * 0.6); ctx.fillStyle = '#2e7d32'; ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#f3e6cc'; ctx.fillRect(x + U * 0.8, y + h * 0.5, w - U * 1.6, h * 0.22);
      ctx.fillStyle = '#c4161c'; ctx.beginPath(); ctx.ellipse(x + w / 2, y + h * 0.61, w * 0.16, h * 0.07, 0.6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(x + U * 1.1, y + h * 0.36, U * 0.9, h * 0.12);
    } else {
      ctx.lineWidth = lw; ctx.strokeStyle = '#000';
      ctx.fillStyle = '#1b1b1b'; ctx.fillRect(x - U, GROUND - U * 1.5, w + U * 2, U * 1.5);
      ctx.beginPath(); ctx.moveTo(x + w * 0.42, y); ctx.lineTo(x + w * 0.58, y); ctx.lineTo(x + w * 0.92, GROUND - U * 1.5); ctx.lineTo(x + w * 0.08, GROUND - U * 1.5); ctx.closePath();
      ctx.fillStyle = '#ff6a00'; ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#f3e6cc';
      ctx.beginPath(); ctx.moveTo(x + w * 0.3, y + h * 0.38); ctx.lineTo(x + w * 0.7, y + h * 0.38); ctx.lineTo(x + w * 0.76, y + h * 0.55); ctx.lineTo(x + w * 0.24, y + h * 0.55); ctx.closePath(); ctx.fill();
    }
  }

  function drawFries(i) {
    const r = i.r, bob = Math.sin(t * 6 + i.x * 0.05) * U * 0.8;
    const x = i.x, y = i.y + bob;
    const glow = ctx.createRadialGradient(x, y, 0, x, y, r * 2.2);
    glow.addColorStop(0, 'rgba(245,197,66,.35)'); glow.addColorStop(1, 'rgba(245,197,66,0)');
    ctx.fillStyle = glow; ctx.fillRect(x - r * 2.2, y - r * 2.2, r * 4.4, r * 4.4);
    ctx.lineWidth = U * 0.4; ctx.strokeStyle = '#000';
    [-0.5, -0.15, 0.2, 0.5].forEach((k, n) => { ctx.fillStyle = n % 2 ? '#f7d36a' : '#f5c542'; ctx.fillRect(x + k * r - r * 0.12, y - r * (1.2 + (n % 2) * 0.2), r * 0.26, r * 1.3); ctx.strokeRect(x + k * r - r * 0.12, y - r * (1.2 + (n % 2) * 0.2), r * 0.26, r * 1.3); });
    ctx.beginPath(); ctx.moveTo(x - r * 0.85, y - r * 0.25); ctx.lineTo(x + r * 0.85, y - r * 0.25); ctx.lineTo(x + r * 0.62, y + r); ctx.lineTo(x - r * 0.62, y + r); ctx.closePath();
    ctx.fillStyle = '#e8102e'; ctx.fill(); ctx.lineWidth = U * 0.5; ctx.stroke();
    ctx.fillStyle = '#f3e6cc'; ctx.beginPath(); ctx.arc(x, y + r * 0.35, r * 0.22, 0, Math.PI * 2); ctx.fill();
  }

  /* ---------- Desenho: mascote ---------- */
  // Contorno do corpo na imagem original (frações da largura/altura), sem as pernas desenhadas
  const BODY = [[0, 0], [1, 0], [1, 0.82], [0.57, 0.82], [0.54, 0.715], [0.30, 0.715], [0.27, 0.78], [0, 0.78]];
  function legPose(phase, air) {
    if (air) {
      // no ar: uma perna à frente dobrada, outra atrás
      return [{ a: 0.9, k: 1.4 }, { a: -0.5, k: 0.9 }];
    }
    return [0, Math.PI].map(off => {
      const p = phase + off;
      return { a: 0.75 * Math.sin(p), k: 0.15 + 1.0 * Math.max(0, Math.cos(p)) };
    });
  }
  function drawLegs(sw, sh, poses) {
    // coordenadas da imagem original: frente é para a esquerda (-x); o desenho é espelhado depois
    const hips = [0.37, 0.50], L1 = 0.12 * sh, L2 = 0.11 * sh, LW = 0.085 * sw, OL = 0.032 * sw;
    const segs = poses.map((p, i) => {
      const hx = -sw / 2 + hips[i] * sw, hy = -sh + 0.70 * sh;
      const kx = hx - Math.sin(p.a) * L1, ky = hy + Math.cos(p.a) * L1;
      const sa = p.a - p.k;
      const fx = kx - Math.sin(sa) * L2, fy = ky + Math.cos(sa) * L2;
      return { hx, hy, kx, ky, fx, fy, sa };
    });
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    [['#000', LW + OL * 2, OL], ['#e8102e', LW, 0]].forEach(([col, width, ex]) => {
      ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = width;
      segs.forEach(s => {
        ctx.beginPath(); ctx.moveTo(s.hx, s.hy); ctx.lineTo(s.kx, s.ky); ctx.lineTo(s.fx, s.fy); ctx.stroke();
        // pé apontando para a frente
        ctx.save(); ctx.translate(s.fx, s.fy); ctx.rotate(Math.max(-0.5, Math.min(0.5, -s.sa * 0.35)));
        const fl = 0.15 * sw + ex, fh = 0.06 * sh + ex * 2;
        rr(-fl + 0.03 * sw, -fh / 2 + 0.008 * sh, fl + ex, fh, fh / 2); ctx.fill();
        ctx.restore();
      });
    });
  }
  function drawGabba() {
    const sh = SPR_H(), sw = SPR_W();
    const lift = Math.max(0, GROUND - G.y);
    if (!G.dead || G.y < GROUND + sh) {
      ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.beginPath(); ctx.ellipse(G.x, GROUND + U * 0.8, sw * 0.36 * Math.max(0.35, 1 - lift / (U * 70)), U * 1.5, 0, 0, Math.PI * 2); ctx.fill();
    }
    if (!img.complete || !img.naturalWidth) return;
    ctx.save();
    const bob = G.onGround && !G.dead ? Math.abs(Math.cos(G.run)) * U * 1.2 : 0;
    ctx.translate(G.x, G.y - bob);
    let tilt;
    if (G.dead) tilt = G.rot;
    else if (G.onGround) tilt = 0.08 + Math.sin(G.run * 2) * 0.03;           // inclinado para a frente, correndo
    else tilt = Math.max(-0.25, Math.min(0.35, G.vy / (U * 500)));
    ctx.rotate(tilt);
    ctx.scale(1 + G.squash, 1 - G.squash);
    ctx.scale(-1, 1);                                                         // vira para a direita
    drawLegs(sw, sh, legPose(G.run, !G.onGround && !G.dead));
    ctx.save();
    ctx.beginPath();
    BODY.forEach(([fx, fy], i) => { const px = -sw / 2 + fx * sw, py = -sh + fy * sh; if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py); });
    ctx.closePath(); ctx.clip();
    ctx.drawImage(img, -sw / 2, -sh, sw, sh);
    ctx.restore();
    ctx.restore();
    G.squash *= 0.85;
  }

  function draw() {
    ctx.save();
    if (shake > 0.2) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    drawBackground();
    ctx.strokeStyle = 'rgba(243,230,204,.25)'; ctx.lineWidth = 1.5;
    lines.forEach(l => { ctx.globalAlpha = l.life; ctx.beginPath(); ctx.moveTo(l.x, l.y); ctx.lineTo(l.x + l.len, l.y); ctx.stroke(); });
    ctx.globalAlpha = 1;
    items.forEach(drawFries);
    obs.forEach(drawObs);
    drawGabba();
    parts.forEach(p => {
      const a = Math.max(0, p.life / p.max);
      if (p.kind === 'ring') { ctx.strokeStyle = 'rgba(' + p.color + ',' + a + ')'; ctx.lineWidth = U * 0.8; ctx.beginPath(); ctx.ellipse(p.x, p.y, p.size * (2 - a) * 1.6, p.size * (2 - a) * 0.6, 0, 0, Math.PI * 2); ctx.stroke(); }
      else { ctx.fillStyle = 'rgba(' + p.color + ',' + (p.kind === 'dust' ? a * 0.6 : a) + ')'; ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (p.kind === 'dust' ? (1.6 - a) : 1), 0, Math.PI * 2); ctx.fill(); }
    });
    ctx.restore();
    if (flash > 0) { ctx.fillStyle = 'rgba(255,255,255,' + flash * 0.5 + ')'; ctx.fillRect(0, 0, W, H); }
  }

  let last = 0;
  function loop(ms) {
    const dt = Math.min(0.033, last ? (ms - last) / 1000 : 0.016); last = ms;
    update(dt); draw();
    requestAnimationFrame(loop);
  }

  function play() {
    initAudio(); reset();
    $('start').hidden = true; $('over').hidden = true;
    running = true; countdown = 3.0; banner('3'); sfx(440, 440, 0.12);
  }
  $('play').addEventListener('click', play);
  $('again').addEventListener('click', play);

  /* ---------- Som ---------- */
  let audio = null;
  function initAudio() { try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); if (audio.state === 'suspended') audio.resume(); } catch (e) {} }
  function sfx(f1, f2, d, type) {
    if (!audio) return;
    const o = audio.createOscillator(), g = audio.createGain(), n = audio.currentTime;
    o.type = type || 'square'; o.frequency.setValueAtTime(f1, n); o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), n + d);
    g.gain.setValueAtTime(0.05, n); g.gain.exponentialRampToValueAtTime(0.0001, n + d);
    o.connect(g).connect(audio.destination); o.start(); o.stop(n + d + 0.02);
  }

  reset();
  requestAnimationFrame(loop);
})();
</script>
<script>
/* Impede o zoom por toque duplo e por pinça (iPhone ignora user-scalable=no) */
(function () {
  let lastEnd = 0;
  document.addEventListener('touchend', function (e) {
    const now = Date.now();
    const onControl = e.target && e.target.closest && e.target.closest('button, a, input, select, textarea, label');
    if (!onControl && now - lastEnd < 350) e.preventDefault();
    lastEnd = now;
  }, { passive: false });
  document.addEventListener('dblclick', function (e) { e.preventDefault(); }, { passive: false });
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (t) {
    document.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false });
  });
  document.addEventListener('touchmove', function (e) { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });
})();
</script>
</body>
