<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Gabba Hero</title>
<meta name="theme-color" content="#0b0809">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow:wght@400;600;700;800&display=swap">
<style>
/* Layout: palco em tela cheia (braço da guitarra em perspectiva); placar no topo, botões das cordas embaixo; telas de setlist e resultado por cima */
:root {
  --bg: #0b0809;
  --surface: #1f1816;
  --surface-2: #2a201d;
  --line: #3b2e29;
  --fg: #f6ece2;
  --muted: #b5a397;
  --red: #e8102e;
  --red-deep: #9c0b1f;
  --mustard: #f2b632;
  --cream: #f3e6cc;
  --ok: #6fbf73;
  --power: #5fd3ff;
  --display: 'Bungee', Impact, 'Arial Black', sans-serif;
  --body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
* { touch-action: manipulation; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--fg); font-family: var(--body); user-select: none; -webkit-user-select: none; overscroll-behavior: none; }
[hidden] { display: none !important; }
#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.hud { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 10px); left: 12px; right: 12px; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; pointer-events: none; z-index: 2; }
.back { pointer-events: auto; color: var(--fg); background: rgba(11,8,9,.72); border: 1px solid rgba(255,255,255,.1); border-radius: 10px; padding: 7px 10px; font-weight: 700; font-size: .85rem; text-decoration: none; }
.chips { display: flex; gap: 6px; }
.chip { background: rgba(11,8,9,.72); border: 1px solid rgba(255,255,255,.1); border-radius: 12px; padding: 6px 10px; text-align: right; }
.chip small { display: block; font-size: .58rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.chip b { font-family: var(--display); font-weight: 400; font-size: 1.2rem; line-height: 1; font-variant-numeric: tabular-nums; }
.chip.main b { color: var(--mustard); font-size: 1.4rem; }

.overlay { position: fixed; inset: 0; background: rgba(11,8,9,.94); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: calc(env(safe-area-inset-top, 0px) + 18px) 16px calc(env(safe-area-inset-bottom, 0px) + 18px); text-align: center; z-index: 5; overflow-y: auto; }
.overlay > * { flex-shrink: 0; }
.overlay img { width: 104px; transform: scaleX(-1); filter: drop-shadow(0 8px 20px rgba(232,16,46,.45)); animation: bob .45s ease-in-out infinite alternate; }
@keyframes bob { to { transform: scaleX(-1) translateY(-7px) rotate(5deg); } }
.overlay h1 { font-family: var(--display); font-weight: 400; font-size: clamp(2.2rem, 12vw, 3rem); line-height: .9; margin: 0; color: var(--cream); }
.overlay h1 span { color: var(--red); text-shadow: 0 0 24px rgba(232,16,46,.5); }
.overlay p { margin: 0; color: var(--muted); max-width: 34ch; }
.overlay p strong { color: var(--fg); }
.label { font-size: .7rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.songs { display: flex; flex-direction: column; gap: 8px; width: min(100%, 380px); }
.song { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 12px; align-items: center; text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 10px 12px; color: var(--fg); cursor: pointer; font: inherit; }
.song[aria-pressed="true"] { border-color: var(--mustard); background: var(--surface-2); box-shadow: 0 0 0 3px rgba(242,182,50,.15); }
.song .ico { font-size: 1.8rem; text-align: center; }
.song strong { display: block; font-family: var(--display); font-weight: 400; font-size: 1rem; line-height: 1.1; }
.song small { display: block; color: var(--muted); font-size: .82rem; margin-top: 2px; }
.song .bpm { font-family: var(--display); font-size: .78rem; color: var(--mustard); text-align: right; line-height: 1.1; }
.song .bpm span { display: block; font-family: var(--body); font-weight: 700; font-size: .62rem; color: var(--muted); letter-spacing: .1em; }
.diff { display: flex; gap: 10px; width: min(100%, 380px); }
.btn { font-family: var(--display); font-size: 1.1rem; letter-spacing: .03em; background: var(--red); color: var(--cream); border: none; border-radius: 14px; padding: 13px 16px; cursor: pointer; box-shadow: 0 5px 0 var(--red-deep); flex: 1; }
.btn small { display: block; font-family: var(--body); font-weight: 700; font-size: .72rem; letter-spacing: 0; opacity: .85; margin-top: 2px; }
.btn.alt { background: var(--mustard); color: #2a1a05; box-shadow: 0 5px 0 #9c6f0d; }
.btn:active { transform: translateY(4px); box-shadow: none; }
.link { color: var(--muted); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; font-weight: 700; font-size: .9rem; text-decoration: none; background: transparent; font-family: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--mustard); outline-offset: 2px; }
.tip { font-size: .85rem; }
.tip b { color: var(--power); }
.stars { font-size: 2.1rem; letter-spacing: 4px; color: var(--mustard); }
.stars .off { color: #3b2e29; }
.big { font-family: var(--display); font-size: 2.6rem; line-height: 1; color: var(--mustard); }
.title-res { font-family: var(--display); font-size: 1.25rem; color: var(--cream); }
.song-res { color: var(--muted); font-weight: 700; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; width: min(100%, 380px); }
.stats div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px; }
.stats small { display: block; font-size: .6rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.stats b { font-family: var(--display); font-weight: 400; font-size: 1.15rem; }
.record { color: var(--ok); font-weight: 700; }
@media (prefers-reduced-motion: reduce) { .overlay img { animation: none; } }
</style>
<script src="../contador.js"></script>
</head>
<body>
<canvas id="game" aria-label="Gabba Hero: toque nos botões quando as notas chegarem na linha"></canvas>

<div class="hud">
  <a class="back" href="../jogos/">‹ Jogos</a>
  <div class="chips">
    <div class="chip"><small>Combo</small><b id="combo">0</b></div>
    <div class="chip main"><small>Pontos</small><b id="score">0</b></div>
  </div>
</div>

<div class="overlay" id="start">
  <img src="../corre/mascote.png" alt="Mascote do Gabba tocando">
  <h1>Gabba <span>Hero</span></h1>
  <p><strong>Toque no botão da cor certa</strong> quando a nota chegar na linha. Quem acerta toca o solo!</p>
  <div class="label">Escolha a música</div>
  <div class="songs" id="songs"></div>
  <p class="tip">⭐ Acerte as <b>notas estrela</b> para soltar o <b>GABBA POWER</b>: pontos em dobro!</p>
  <div class="diff">
    <button class="btn alt" id="easy" type="button">FÁCIL<small>para aquecer</small></button>
    <button class="btn" id="rock" type="button">ROCK<small>para quem manda bem</small></button>
  </div>
  <a class="link" href="../jogos/">Escolher outro jogo</a>
</div>

<div class="overlay" id="over" hidden>
  <img src="../corre/mascote.png" alt="">
  <div class="song-res" id="res-song"></div>
  <div class="title-res" id="res-title">Show!</div>
  <div class="stars" id="res-stars"></div>
  <div class="big" id="res-score">0</div>
  <div class="stats">
    <div><small>Acertos</small><b id="res-pct">0%</b></div>
    <div><small>Maior combo</small><b id="res-combo">0</b></div>
    <div><small>Perfeitos</small><b id="res-perf">0</b></div>
  </div>
  <p id="res-msg"></p>
  <div class="diff">
    <button class="btn alt" id="again-easy" type="button">FÁCIL</button>
    <button class="btn" id="again-rock" type="button">ROCK</button>
  </div>
  <button class="link" id="to-setlist" type="button">Trocar de música</button>
</div>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const cv = $('game'), ctx = cv.getContext('2d');
  const STORE = 'gabba-hero-v2';
  let best = {};
  try { best = JSON.parse(localStorage.getItem(STORE) || '{}') || {}; } catch (e) {}

  const mascote = new Image(); mascote.src = '../corre/mascote.png';
  let W = 0, H = 0, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize); resize();

  /* =====================================================================
     MÚSICAS ORIGINAIS (compostas para o jogo e tocadas pelo próprio aparelho)
     Melodias: [passo em 1/16, semitons a partir da tônica do solo, duração em 1/16]
     ===================================================================== */
  const SOLO_RUN = (base) => { const sc = [0, 3, 5, 7, 10, 12, 15, 17]; const m = []; for (let i = 0; i < 16; i++) { const k = i < 8 ? i : 15 - i; m.push([i * 2, sc[k] + base, 2]); } return m; };
  const SONGS = [
    {
      id: 'chapa', title: 'Chapa Quente', style: 'Punk rock acelerado', ico: '🔥', bpm: 168, lead: 64, leadKind: 'gtr',
      theme: ['#1a070a', '#3a0d12', '#e8102e'],
      roots: { E: 40, C: 36, D: 38, G: 43, A: 45, B: 47 },
      mel: {
        verso: { bars: 2, n: [[0,0,2],[2,0,2],[4,3,2],[6,5,2],[8,7,3],[12,5,2],[14,3,2],[16,0,2],[18,0,2],[20,3,2],[22,5,2],[24,3,3],[28,-2,4]] },
        refrao: { bars: 2, n: [[0,7,2],[2,7,2],[4,10,2],[6,12,4],[10,10,2],[12,7,4],[16,5,2],[18,7,2],[20,3,2],[22,5,4],[26,3,2],[28,0,4]] },
        solo: { bars: 2, n: SOLO_RUN(0) }
      },
      sections: [
        { name: 'INTRO', bars: 2, prog: ['E', 'E'], drum: 'intro', gtr: 'mute' },
        { name: 'VERSO', bars: 8, prog: ['E', 'E', 'C', 'D'], drum: 'punk', gtr: 'mute', mel: 'verso' },
        { name: 'REFRÃO', bars: 8, prog: ['G', 'D', 'E', 'C'], drum: 'punkOpen', gtr: 'open', mel: 'refrao', star: true },
        { name: 'VERSO', bars: 8, prog: ['E', 'E', 'C', 'D'], drum: 'punk', gtr: 'mute', mel: 'verso' },
        { name: 'SOLO!', bars: 4, prog: ['E', 'D', 'C', 'B'], drum: 'punkOpen', gtr: 'open', mel: 'solo', star: true },
        { name: 'REFRÃO', bars: 8, prog: ['G', 'D', 'E', 'C'], drum: 'punkOpen', gtr: 'open', mel: 'refrao', star: true },
        { name: 'FINAL', bars: 2, prog: ['E', 'E'], drum: 'end', gtr: 'ring' }
      ]
    },
    {
      id: 'baiao', title: 'Baião do Gabba', style: 'Forró rock do Ceará', ico: '🪗', bpm: 138, lead: 69, leadKind: 'acc',
      theme: ['#1d0f05', '#3d2208', '#f2b632'],
      roots: { A: 45, D: 50, E: 52, G: 43 },
      mel: {
        verso: { bars: 2, n: [[0,0,3],[3,4,3],[6,7,2],[8,9,3],[11,7,3],[14,4,2],[16,5,3],[19,4,3],[22,2,2],[24,0,4],[28,-2,2],[30,-5,2]] },
        refrao: { bars: 2, n: [[0,12,3],[3,10,3],[6,9,2],[8,7,2],[10,9,2],[12,10,4],[16,9,3],[19,7,3],[22,4,2],[24,7,3],[27,9,3],[30,12,2]] },
        sanfona: { bars: 2, n: [[0,7,1],[2,9,1],[4,10,1],[6,12,1],[8,14,1],[10,12,1],[12,10,1],[14,9,1],[16,7,1],[18,4,1],[20,5,1],[22,7,1],[24,9,2],[28,7,2],[30,4,2]] }
      },
      sections: [
        { name: 'INTRO', bars: 2, prog: ['A', 'A'], drum: 'baiaoIntro', gtr: 'acc' },
        { name: 'VERSO', bars: 8, prog: ['A', 'A', 'D', 'E'], drum: 'baiao', gtr: 'acc', mel: 'verso' },
        { name: 'REFRÃO', bars: 8, prog: ['D', 'A', 'E', 'A'], drum: 'baiaoRock', gtr: 'open', mel: 'refrao', star: true },
        { name: 'SANFONA!', bars: 4, prog: ['A', 'G', 'D', 'E'], drum: 'baiao', gtr: 'acc', mel: 'sanfona', star: true },
        { name: 'VERSO', bars: 8, prog: ['A', 'A', 'D', 'E'], drum: 'baiao', gtr: 'acc', mel: 'verso' },
        { name: 'REFRÃO', bars: 8, prog: ['D', 'A', 'E', 'A'], drum: 'baiaoRock', gtr: 'open', mel: 'refrao', star: true },
        { name: 'FINAL', bars: 2, prog: ['A', 'A'], drum: 'end', gtr: 'ring' }
      ]
    },
    {
      id: 'metal', title: 'Moicano Metal', style: 'Metal pesado, bumbo duplo', ico: '🤘', bpm: 150, lead: 64, leadKind: 'gtr',
      theme: ['#0b0718', '#1c1240', '#7a5cff'],
      roots: { E: 40, F: 41, C: 36, D: 38, G: 43 },
      mel: {
        verso: { bars: 2, n: [[0,0,2],[2,3,2],[4,5,2],[6,7,2],[8,8,4],[12,7,4],[16,5,2],[18,3,2],[20,1,4],[24,0,6],[30,-1,2]] },
        refrao: { bars: 2, n: [[0,12,4],[4,10,4],[8,7,3],[11,8,1],[12,10,4],[16,7,2],[18,8,2],[20,10,2],[22,12,2],[24,15,6],[30,12,2]] },
        quebra: { bars: 1, n: [[0,0,4],[6,0,2],[8,1,4],[12,-1,4]] },
        solo: { bars: 2, n: SOLO_RUN(0).map(([s, p, d]) => [s, p + (s >= 16 ? 1 : 0), d]) }
      },
      sections: [
        { name: 'INTRO', bars: 2, prog: ['E', 'E'], drum: 'metalIntro', gtr: 'gallop' },
        { name: 'VERSO', bars: 8, prog: ['E', 'E', 'F', 'E'], drum: 'metal', gtr: 'gallop', mel: 'verso' },
        { name: 'REFRÃO', bars: 8, prog: ['C', 'D', 'E', 'E'], drum: 'metalDouble', gtr: 'open', mel: 'refrao', star: true },
        { name: 'PESADÃO', bars: 4, prog: ['E', 'F', 'E', 'F'], drum: 'half', gtr: 'chug', mel: 'quebra' },
        { name: 'SOLO!', bars: 4, prog: ['E', 'D', 'C', 'D'], drum: 'metalDouble', gtr: 'open', mel: 'solo', star: true },
        { name: 'REFRÃO', bars: 8, prog: ['C', 'D', 'E', 'E'], drum: 'metalDouble', gtr: 'open', mel: 'refrao', star: true },
        { name: 'FINAL', bars: 2, prog: ['E', 'E'], drum: 'end', gtr: 'ring' }
      ]
    }
  ];

  /* ===================== ÁUDIO ===================== */
  let ac = null, master = null, revIn = null, curve = null, noiseBuf = null;
  function initAudio() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      const comp = ac.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 5; comp.attack.value = 0.003; comp.release.value = 0.15;
      master = ac.createGain(); master.gain.value = 0.85; master.connect(comp); comp.connect(ac.destination);
      noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      curve = new Float32Array(2048); for (let i = 0; i < 2048; i++) { const x = i / 1024 - 1; curve[i] = Math.tanh(x * 8); }
      // reverb curto (sala de show)
      const len = Math.floor(ac.sampleRate * 1.1), ir = ac.createBuffer(2, len, ac.sampleRate);
      for (let c = 0; c < 2; c++) { const ch = ir.getChannelData(c); for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6); }
      const conv = ac.createConvolver(); conv.buffer = ir; revIn = ac.createGain(); revIn.gain.value = 0.5; revIn.connect(conv); conv.connect(master);
    } catch (e) { ac = null; }
  }
  const mf = m => 440 * Math.pow(2, (m - 69) / 12);
  function env(g, t, a, peak, dec) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + dec); }
  function out(node, pan, rev) {
    let n = node;
    if (pan && ac.createStereoPanner) { const p = ac.createStereoPanner(); p.pan.value = pan; n.connect(p); n = p; }
    n.connect(master);
    if (rev) { const s = ac.createGain(); s.gain.value = rev; n.connect(s); s.connect(revIn); }
  }
  function noise(t, type, freq, peak, dec, pan, rev, q) {
    const s = ac.createBufferSource(); s.buffer = noiseBuf;
    const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq; if (q) f.Q.value = q;
    const g = ac.createGain(); env(g, t, 0.002, peak, dec);
    s.connect(f).connect(g); out(g, pan, rev); s.start(t, Math.random() * 0.5); s.stop(t + dec + 0.05);
  }
  const I = {
    kick(t, v = 1) { const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.setValueAtTime(160, t); o.frequency.exponentialRampToValueAtTime(44, t + 0.11); env(g, t, 0.002, 0.95 * v, 0.22); o.connect(g); out(g); o.start(t); o.stop(t + 0.27); noise(t, 'highpass', 3000, 0.08 * v, 0.012); },
    snare(t, v = 1) { noise(t, 'highpass', 1400, 0.52 * v, 0.17, 0, 0.35); const o = ac.createOscillator(), g = ac.createGain(); o.type = 'triangle'; o.frequency.setValueAtTime(220, t); o.frequency.exponentialRampToValueAtTime(160, t + 0.08); env(g, t, 0.002, 0.32 * v, 0.09); o.connect(g); out(g); o.start(t); o.stop(t + 0.12); },
    hat(t, open, v = 1) { noise(t, 'highpass', 8000, (open ? 0.13 : 0.09) * v, open ? 0.17 : 0.03, 0.3); },
    crash(t) { noise(t, 'highpass', 4500, 0.26, 1.4, -0.3, 0.3); },
    tom(t, f) { const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f * 0.6, t + 0.2); env(g, t, 0.002, 0.7, 0.24); o.connect(g); out(g, f > 140 ? 0.25 : -0.25, 0.2); o.start(t); o.stop(t + 0.3); },
    stick(t) { const o = ac.createOscillator(), g = ac.createGain(); o.type = 'square'; o.frequency.value = 1900; env(g, t, 0.001, 0.13, 0.03); o.connect(g); out(g); o.start(t); o.stop(t + 0.05); },
    tri(t, open) { [5200].forEach(f => { const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.value = f; env(g, t, 0.001, open ? 0.05 : 0.035, open ? 0.35 : 0.06); o.connect(g); out(g, 0.45); o.start(t); o.stop(t + 0.45); }); },
    zab(t, v = 1) { I.kick(t, 0.8 * v); noise(t, 'bandpass', 220, 0.25 * v, 0.09, -0.1, 0, 2); },
    rim(t) { noise(t, 'bandpass', 1700, 0.22, 0.05, -0.15, 0.1, 4); },
    bass(t, m, dur, kind) {
      const o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
      o.type = kind === 'round' ? 'triangle' : 'sawtooth'; o.frequency.value = mf(m);
      f.type = 'lowpass'; f.frequency.setValueAtTime(kind === 'round' ? 900 : 1300, t); f.frequency.exponentialRampToValueAtTime(380, t + dur);
      env(g, t, 0.004, kind === 'round' ? 0.5 : 0.36, dur); o.connect(f).connect(g); out(g); o.start(t); o.stop(t + dur + 0.05);
    },
    gtr(t, root, dur, muted, peak, pan) {
      const sh = ac.createWaveShaper(); sh.curve = curve;
      const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = muted ? 900 : 3200;
      const g = ac.createGain(); env(g, t, 0.003, peak || (muted ? 0.11 : 0.085), dur);
      [0, 7, 12].forEach((iv, k) => { const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = mf(root + 12 + iv); o.detune.value = (k - 1) * 7 + (pan || 0) * 6; o.connect(sh); o.start(t); o.stop(t + dur + 0.05); });
      sh.connect(f).connect(g); out(g, pan || 0);
    },
    acc(t, notes, dur, peak, pan) {
      const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 2600;
      const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + 0.02); g.gain.setValueAtTime(peak, t + Math.max(0.03, dur - 0.05)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.06);

    const nk = ctx.createLinearGradient(0, tl.y, 0, bl.y); nk.addColorStop(0, P ? '#06202e' : '#120c0b'); nk.addColorStop(1, P ? '#0d4a66' : '#2b1a14');
    ctx.fillStyle = nk; ctx.fill();
    ctx.strokeStyle = P ? 'rgba(95,211,255,.9)' : 'rgba(243,230,204,.35)'; ctx.lineWidth = P ? 3 : 2; ctx.stroke();
    if (playing && L) {
      for (let k = -1; k < 14; k++) {
        const bt = Math.floor(st / BEAT) + k, tt = bt * BEAT, p = 1 - (tt - st) / travel;
        if (p < 0 || p > 1.12) continue;
        const a = proj(p, -1.05, g), b = proj(p, 1.05, g);
        ctx.strokeStyle = bt % 4 === 0 ? 'rgba(243,230,204,.45)' : 'rgba(243,230,204,.13)'; ctx.lineWidth = bt % 4 === 0 ? 2.5 : 1.2;
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      }
    }
    for (let l = 0; l < 3; l++) { const a = proj(0, laneOff(l), g), b = proj(1.12, laneOff(l), g); ctx.strokeStyle = LANES[l].glow + (press[l] > 0 ? '.85)' : '.25)'); ctx.lineWidth = press[l] > 0 ? 3 : 1.5; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
    const hl = proj(1, -1.05, g), hr = proj(1, 1.05, g);
    ctx.strokeStyle = 'rgba(243,230,204,' + (0.6 + 0.4 * pulse) + ')'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(hl.x, hl.y); ctx.lineTo(hr.x, hr.y); ctx.stroke();

    // notas
    if (playing) {
      for (let i = notes.length - 1; i >= 0; i--) {
        const n = notes[i]; if (n.state === 1) continue;
        const p = 1 - (n.t - st) / travel; if (p < 0 || p > 1.15) continue;
        const pr = proj(p, laneOff(n.lane), g), r = 22 * pr.scale * Math.min(1.25, W / 360);
        ctx.save(); ctx.translate(pr.x, pr.y); ctx.globalAlpha = n.state === 2 ? 0.3 : 1;
        if (n.star) {
          ctx.scale(1, 0.75); ctx.rotate(performance.now() / 600);
          ctx.shadowColor = '#5fd3ff'; ctx.shadowBlur = 16;
          starPath(r * 1.35); ctx.fillStyle = LANES[n.lane].color; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#5fd3ff'; ctx.stroke();
        } else {
          ctx.scale(1, 0.55);
          ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(0, r * 0.25, r * 1.05, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = P ? '#5fd3ff' : LANES[n.lane].color; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.beginPath(); ctx.arc(-r * 0.3, -r * 0.35, r * 0.35, 0, Math.PI * 2); ctx.fill();
          ctx.lineWidth = 3; ctx.strokeStyle = '#0b0809'; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.stroke();
        }
        ctx.restore();
      }
    }

    // botões
    for (let l = 0; l < 3; l++) {
      const pr = proj(1, laneOff(l), g), r = Math.min(W / 3 * 0.36, 44), on = press[l] > 0;
      ctx.save(); ctx.translate(pr.x, pr.y);
      ctx.fillStyle = '#0b0809'; ctx.beginPath(); ctx.arc(0, 4, r + 5, 0, Math.PI * 2); ctx.fill();
      ctx.lineWidth = 5; ctx.strokeStyle = LANES[l].color; ctx.fillStyle = on ? LANES[l].color : 'rgba(11,8,9,.85)';
      ctx.beginPath(); ctx.arc(0, on ? 3 : 0, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = on ? '#0b0809' : LANES[l].color; ctx.beginPath(); ctx.arc(0, on ? 3 : 0, r * 0.32, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    flashes.forEach(f => {
      const pr = proj(1, laneOff(f.lane), g), a = f.life / 0.25;
      const gr = ctx.createRadialGradient(pr.x, pr.y, 0, pr.x, pr.y, 95); gr.addColorStop(0, LANES[f.lane].glow + (0.75 * a) + ')'); gr.addColorStop(1, LANES[f.lane].glow + '0)');
      ctx.fillStyle = gr; ctx.fillRect(pr.x - 95, pr.y - 95, 190, 190);
    });
    sparks.forEach(s => { ctx.globalAlpha = Math.max(0, s.life / 0.6); ctx.fillStyle = s.c; ctx.fillRect(s.x - 2, s.y - 2, 4, 4); });
    ctx.globalAlpha = 1;
    ctx.textAlign = 'center';
    popups.forEach(p => { const pr = proj(1, laneOff(p.lane), g); ctx.globalAlpha = Math.min(1, p.life / 0.3); ctx.fillStyle = p.color; ctx.font = Math.min(W * 0.05, 20) + 'px Bungee, Impact, sans-serif'; ctx.fillText(p.text, pr.x, pr.y - 68 - (0.55 - p.life) * 60); });
    ctx.globalAlpha = 1;

    // plateia: silhuetas pulando no rodapé
    const n = Math.ceil(W / 34), baseY = H + 6, jump = (0.2 + crowd) * 14;
    for (let i = 0; i < n; i++) {
      const x = i * 34 + 10 + (i % 2) * 8, ph = (i * 0.37) % 1;
      const hop = playing ? Math.max(0, Math.sin((beatPh + ph * 0.3) * Math.PI)) * jump * (crowd > 0.3 ? 1 : 0.2) : 0;
      ctx.fillStyle = '#050304';
      ctx.beginPath(); ctx.arc(x, baseY - 46 - hop, 11, 0, Math.PI * 2); ctx.fill();
      ctx.fillRect(x - 14, baseY - 36 - hop, 28, 40);
      if (playing && crowd > 0.55 && i % 2 === 0) { ctx.save(); ctx.strokeStyle = '#050304'; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x - 10, baseY - 34 - hop); ctx.lineTo(x - 18, baseY - 66 - hop); ctx.moveTo(x + 10, baseY - 34 - hop); ctx.lineTo(x + 18, baseY - 66 - hop); ctx.stroke(); ctx.restore(); }
    }

    // mascote
    if (mascote.complete && mascote.naturalWidth) {
      const mh = Math.min(H * 0.16, 125), mw = mh * mascote.naturalWidth / mascote.naturalHeight;
      const bounce = playing ? pulse * 14 : 0;
      ctx.save(); ctx.translate(W * 0.13, H * 0.235 + mh - bounce); ctx.rotate(playing ? (beatPh < 0.5 ? 0.14 : -0.06) * (combo >= 5 ? 1.4 : 1) : 0); ctx.scale(-1, 1);
      if (P || combo >= 10) { ctx.shadowColor = P ? '#5fd3ff' : '#f2b632'; ctx.shadowBlur = 18 + Math.min(30, combo); }
      ctx.drawImage(mascote, -mw / 2, -mh, mw, mh); ctx.restore();
    }
    // medidores: plateia e Gabba Power
    const bx = W - 22, by = H * 0.25, bh = H * 0.32;
    ctx.fillStyle = 'rgba(11,8,9,.75)'; ctx.fillRect(bx - 8, by - 6, 18, bh + 12);
    const cg = ctx.createLinearGradient(0, by + bh, 0, by); cg.addColorStop(0, '#ff6b5e'); cg.addColorStop(0.45, '#f2b632'); cg.addColorStop(1, '#6fbf73');
    ctx.fillStyle = cg; ctx.fillRect(bx - 4, by + bh * (1 - crowd), 10, bh * crowd);
    const px = W - 46;
    ctx.fillStyle = 'rgba(11,8,9,.75)'; ctx.fillRect(px - 8, by - 6, 18, bh + 12);
    const pw = P ? Math.max(0, (powerUntil - st) / 8) : power;
    ctx.fillStyle = '#5fd3ff'; ctx.fillRect(px - 4, by + bh * (1 - pw), 10, bh * pw);
    ctx.font = '15px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('🤘', bx + 1, by + bh + 26); ctx.fillText('⚡', px + 1, by + bh + 26);
    if (playing && mult() > 1) { ctx.save(); ctx.font = Math.min(W * 0.085, 32) + 'px Bungee, Impact, sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = P ? '#5fd3ff' : '#f2b632'; ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 12; ctx.fillText('x' + mult(), W - 34, H * 0.215); ctx.restore(); }
    // contagem e faixas de anúncio
    if (playing && st < 0) { const c = Math.ceil(-st / BEAT); ctx.save(); ctx.font = Math.min(W * 0.25, 110) + 'px Bungee, Impact, sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#f3e6cc'; ctx.globalAlpha = 0.9; if (c >= 1 && c <= 4) ctx.fillText(String(c), W / 2, H * 0.52); ctx.restore(); }
    if (banner) {
      const a = Math.min(1, banner.life / 0.3), sc = 1 + Math.max(0, banner.life - 1) * 0.6;
      ctx.save(); ctx.globalAlpha = a; ctx.translate(W / 2, H * 0.46); ctx.scale(sc, sc); ctx.font = Math.min(W * 0.1, 44) + 'px Bungee, Impact, sans-serif'; ctx.textAlign = 'center';
      ctx.fillStyle = banner.color; ctx.shadowColor = banner.color; ctx.shadowBlur = 20; ctx.fillText(banner.text, 0, 0); ctx.restore();
    }
    ctx.restore();
  }

  let last = 0;
  function loop(ms) {
    const dt = Math.min(0.05, last ? (ms - last) / 1000 : 0.016); last = ms;
    if (playing) {
      schedule();
      const st = songTime();
      for (const n of notes) { if (n.state) continue; if (st - n.t > WIN_GOOD) { miss(n); if (!playing) break; } else if (n.t - st > 0) break; }
      if (playing && L) {
        const b = L.bars[Math.floor(st / L.BAR)];
        if (b && b.sec !== curSection) { curSection = b.sec; if (st > 0.1 && b.sec.name !== 'FINAL') banner = { text: b.sec.name, life: 1.1, color: '#f3e6cc' }; }
        if (st > L.len + 0.4) finish(true);
      }
    }
    for (let l = 0; l < 3; l++) press[l] = Math.max(0, press[l] - dt);
    flashes.forEach(f => f.life -= dt); while (flashes.length && flashes[0].life <= 0) flashes.shift();
    popups.forEach(p => p.life -= dt); for (let i = popups.length - 1; i >= 0; i--) if (popups[i].life <= 0) popups.splice(i, 1);
    sparks.forEach(s => { s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 700 * dt; s.life -= dt; }); for (let i = sparks.length - 1; i >= 0; i--) if (sparks[i].life <= 0) sparks.splice(i, 1);
    if (banner) { banner.life -= dt; if (banner.life <= 0) banner = null; }
    draw(dt);
    requestAnimationFrame(loop);
  }

  $('easy').addEventListener('click', () => start('easy'));
  $('rock').addEventListener('click', () => start('rock'));
  $('again-easy').addEventListener('click', () => start('easy'));
  $('again-rock').addEventListener('click', () => start('rock'));
  $('to-setlist').addEventListener('click', () => { $('over').hidden = true; $('start').hidden = false; });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && playing) { playing = false; try { ac.suspend(); } catch (e) {} $('start').hidden = false; }
    else if (!document.hidden && ac && ac.state === 'suspended') { try { ac.resume(); } catch (e) {} }
  });
  requestAnimationFrame(loop);

  // gancho de teste (sem efeito para o jogador)
  window.__hero = {
    info: () => SONGS.map(s => { const Lx = layout(s), m = buildMelody(s, Lx); return { id: s.id, len: Math.round(Lx.len), easy: buildChart(buildMelody(s, Lx), 'easy').length, rock: buildChart(m, 'rock').length }; }),
    pick: id => { song = SONGS.find(s => s.id === id) || song; renderSongs(); },
    peek: () => ({ st: songTime(), next: notes.filter(n => !n.state).slice(0, 4).map(n => ({ t: n.t, lane: n.lane })) })
  };
})();
</script>
<script>
/* Impede o zoom por toque duplo e por pinça (iPhone ignora user-scalable=no) */
(function () {
  let lastEnd = 0;
  document.addEventListener('touchend', function (e) {
    const now = Date.now();
    const onControl = e.target && e.target.closest && e.target.closest('button, a, input, select, textarea, label');
    if (!onControl && now - lastEnd < 350) e.preventDefault();
    lastEnd = now;
  }, { passive: false });
  document.addEventListener('dblclick', function (e) { e.preventDefault(); }, { passive: false });
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (t) {
    document.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false });
  });
  document.addEventListener('touchmove', function (e) { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });
})();
</script>
</body>
