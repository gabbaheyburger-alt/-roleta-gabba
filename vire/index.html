<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Vire um Gabba</title>
<meta name="theme-color" content="#0d0a09">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow:wght@400;600;700;800&display=swap">
<style>
/* Layout: três telas — início, câmera (foto ao vivo com barra de botões embaixo) e resultado (foto pronta + compartilhar) */
:root {
  --bg: #0d0a09;
  --surface: #1f1816;
  --line: #3b2e29;
  --fg: #f6ece2;
  --muted: #b5a397;
  --red: #e8102e;
  --red-deep: #9c0b1f;
  --mustard: #f2b632;
  --cream: #f3e6cc;
  --display: 'Bungee', Impact, 'Arial Black', sans-serif;
  --body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
* { touch-action: manipulation; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); overflow: hidden; user-select: none; -webkit-user-select: none; }
[hidden] { display: none !important; }
.screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px); }

/* Início */
#start { justify-content: center; gap: 16px; text-align: center; overflow-y: auto; }
#start img { width: 150px; transform: scaleX(-1); filter: drop-shadow(0 8px 20px rgba(232,16,46,.45)); animation: bob 1.4s ease-in-out infinite; }
@keyframes bob { 50% { transform: scaleX(-1) translateY(-8px) rotate(3deg); } }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(2.3rem, 12vw, 3.2rem); line-height: .92; margin: 0; }
h1 span { color: var(--red); display: block; text-shadow: 0 0 24px rgba(232,16,46,.5); }
.lead { margin: 0; color: var(--muted); max-width: 30ch; font-size: 1.05rem; }
.lead b { color: var(--fg); }
.note { margin: 0; color: var(--muted); font-size: .82rem; max-width: 34ch; }
.btn { font-family: var(--display); font-size: 1.25rem; letter-spacing: .03em; background: var(--red); color: var(--cream); border: none; border-radius: 14px; padding: 15px 26px; cursor: pointer; box-shadow: 0 5px 0 var(--red-deep); display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--red-deep); }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); box-shadow: none; font-family: var(--body); font-weight: 800; font-size: 1rem; }
.link { color: var(--muted); font-weight: 700; font-size: .9rem; text-decoration: none; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
.err { color: #ff8a80; font-weight: 600; margin: 0; max-width: 32ch; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--mustard); outline-offset: 3px; }

/* Câmera */
#cam { padding-left: 0; padding-right: 0; justify-content: center; gap: 12px; }
.stage { position: relative; width: min(100vw, calc((100dvh - 150px) * 0.8)); aspect-ratio: 4 / 5; max-width: 100%; }
.stage canvas { width: 100%; height: 100%; display: block; border-radius: 6px; background: #000; }
.status { position: absolute; left: 50%; top: 58%; transform: translateX(-50%); background: rgba(13,10,9,.78); border: 1px solid rgba(255,255,255,.14); color: var(--fg); padding: 7px 12px; border-radius: 999px; font-weight: 700; font-size: .85rem; white-space: nowrap; pointer-events: none; }
.bar { display: flex; align-items: center; justify-content: space-between; width: min(100%, 420px); padding: 0 24px; }
.round { width: 54px; height: 54px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font-size: 1.4rem; cursor: pointer; display: flex; align-items: center; justify-content: center; text-decoration: none; }
.shutter { width: 82px; height: 82px; border-radius: 50%; border: 5px solid var(--cream); background: var(--red); cursor: pointer; box-shadow: 0 0 0 4px rgba(232,16,46,.35); }
.shutter:active { transform: scale(.92); }
.flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 9; transition: opacity .35s; }
.flash.on { opacity: .9; transition: none; }

/* Resultado */
#result { justify-content: center; gap: 14px; overflow-y: auto; }
#result img { width: min(100%, calc((100dvh - 230px) * 0.8)); aspect-ratio: 4 / 5; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,.6); }
.row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; width: min(100%, 420px); }
.row .btn { flex: 1; min-width: 150px; }
.promo { margin: 0; background: linear-gradient(135deg, #e3122d, #a50c21); color: #fff6ea; border: 2px solid #f4e9d8; border-radius: 14px; padding: 10px 14px; max-width: 34ch; text-align: center; font-weight: 700; line-height: 1.3; box-shadow: 0 0 24px rgba(227,18,45,.45); }
.promo b { display: block; font-size: 1.15rem; }
.promo small { display: block; margin-top: 4px; font-weight: 600; opacity: .9; }
.tip { margin: 0; color: var(--muted); font-size: .85rem; text-align: center; max-width: 34ch; }
@media (prefers-reduced-motion: reduce) { #start img { animation: none; } }
</style>
<script src="../contador.js"></script>
</head>
<body>

<section class="screen" id="start">
  <img src="../corre/mascote.png" alt="Mascote do Gabba Burger">
  <h1>Vire um <span>Gabba!</span></h1>
  <p class="lead">Ganhe o <b>moicano</b> e os <b>óculos</b> do nosso mascote, tire a foto e marque <b>@gabbaburger</b>.</p>
  <p class="promo" data-promo hidden></p>
  <button class="btn" id="open" type="button">📸 ABRIR CÂMERA</button>
  <p class="err" id="start-err" hidden></p>
  <p class="note">A foto é feita e fica só no seu celular. Nada é enviado para a gente.</p>
  <a class="link" id="voltar" href="../jogos/">‹ Voltar aos jogos</a>
</section>

<section class="screen" id="cam" hidden>
  <div class="stage">
    <canvas id="view" aria-label="Câmera com o filtro do Gabba"></canvas>
    <div class="status" id="status">Carregando o filtro…</div>
  </div>
  <div class="bar">
    <button class="round" id="back" type="button" aria-label="Voltar">‹</button>
    <button class="shutter" id="shoot" type="button" aria-label="Tirar foto"></button>
    <button class="round" id="flip" type="button" aria-label="Trocar câmera">⟲</button>
  </div>
</section>

<section class="screen" id="result" hidden>
  <img id="photo" alt="Sua foto com o filtro do Gabba">
  <div class="row">
    <button class="btn" id="share" type="button">Compartilhar</button>
    <a class="btn ghost" id="save" download="vire-um-gabba.jpg" href="#">Salvar foto</a>
  </div>
  <button class="btn ghost" id="again" type="button">Tirar outra</button>
  <p class="promo" data-promo hidden></p>
  <p class="tip" id="tip">Posta no Instagram e marca <b>@gabbaburger</b> que a gente reposta!</p>
</section>

<div class="flash" id="flash"></div>

<script>
// Veio da bio? O "Voltar" leva para a bio. Promoção "poste e ganhe" ligada pela área do dono da bio (bio/config.json)
(function () {
  try {
    var m = document.referrer.match(/\/(bio2?)\//), alvo = m ? m[1] : sessionStorage.getItem('gabba-veio-bio');
    if (alvo === '1') alvo = 'bio';
    if (alvo) { sessionStorage.setItem('gabba-veio-bio', alvo); var v = document.getElementById('voltar'); v.href = '../' + alvo + '/'; v.textContent = '‹ Voltar'; }
  } catch (e) {}
  fetch('../bio/config.json?v=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (c) {
    var p = c && c.promo; if (!p || !p.ativo || !p.premio) return;
    document.querySelectorAll('[data-promo]').forEach(function (el) {
      el.innerHTML = '';
      var t = document.createElement('span'); t.textContent = '🎁 Poste e ganhe';
      var b = document.createElement('b'); b.textContent = p.premio;
      var sm = document.createElement('small'); sm.textContent = 'Poste a foto nos stories marcando @gabbaburger e mostre no caixa.';
      el.append(t, b, sm); el.hidden = false;
    });
  }).catch(function () {});
})();
</script>
<script type="module">
const $ = id => document.getElementById(id);
const conta = (n, t) => { try { window.gabbaConta && window.gabbaConta(n, t); } catch (e) {} };

/* ---------- Saída: foto 4:5 (1080×1350) ---------- */
const OUT_W = 1080, OUT_H = 1350;
const view = $('view'), vctx = view.getContext('2d');
view.width = OUT_W; view.height = OUT_H;

const mascote = new Image(); mascote.src = '../corre/mascote.png';
const video = document.createElement('video');
video.setAttribute('playsinline', ''); video.muted = true; video.autoplay = true;

let stream = null, facing = 'user', running = false, landmarker = null, faces = [], smooth = [], lastVideoTime = -1;

/* ---------- Detecção de rosto (MediaPipe, roda no próprio celular) ---------- */
async function loadLandmarker() {
  try {
    const { FaceLandmarker, FilesetResolver } = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
    const files = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
    const opts = (delegate) => ({
      baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task', delegate },
      runningMode: 'VIDEO', numFaces: 4, minFaceDetectionConfidence: 0.5, minTrackingConfidence: 0.5
    });
    try { landmarker = await FaceLandmarker.createFromOptions(files, opts('GPU')); }
    catch (e) { landmarker = await FaceLandmarker.createFromOptions(files, opts('CPU')); }
  } catch (e) {
    landmarker = null;
  }
}
const landmarkerReady = loadLandmarker();

/* ---------- Câmera ---------- */
async function startCamera() {
  stopCamera();
  stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 1280 } }, audio: false });
  video.srcObject = stream;
  await video.play();
}
function stopCamera() { if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; } }

/* ---------- Geometria ---------- */
// Recorte "cover" do vídeo dentro da foto 4:5
function coverRect() {
  const vw = video.videoWidth || 1, vh = video.videoHeight || 1;
  const s = Math.max(OUT_W / vw, OUT_H / vh);
  const w = vw * s, h = vh * s;
  return { s, ox: (OUT_W - w) / 2, oy: (OUT_H - h) / 2, vw, vh };
}
// Ponto normalizado do MediaPipe -> pixel na foto (já espelhado na câmera frontal)
function toPx(p, cr) {
  let x = cr.ox + p.x * cr.vw * cr.s;
  const y = cr.oy + p.y * cr.vh * cr.s;
  if (facing === 'user') x = OUT_W - x;
  return { x, y };
}
const KEYS = { eyeL: 33, eyeR: 263, top: 10, chin: 152, sideL: 234, sideR: 454, bridge: 168 };
function faceGeom(lm, cr) {
  const g = {};
  for (const k in KEYS) g[k] = toPx(lm[KEYS[k]], cr);
  return g;
}
function lerpGeom(a, b, t) {
  if (!a) return b;
  const o = {};
  for (const k in b) o[k] = { x: a[k].x + (b[k].x - a[k].x) * t, y: a[k].y + (b[k].y - a[k].y) * t };
  return o;
}

/* ---------- Acessórios no traço do mascote ---------- */
const INK = '#0b0909', CREAM = '#f3e6cc';
function drawGlasses(ctx, g) {
  const cx = (g.eyeL.x + g.eyeR.x) / 2, cy = (g.eyeL.y + g.eyeR.y) / 2;
  // olho da esquerda da imagem primeiro (na câmera frontal espelhada a ordem inverte)
  const a = g.eyeL.x <= g.eyeR.x ? g.eyeL : g.eyeR, b = a === g.eyeL ? g.eyeR : g.eyeL;
  const dx = b.x - a.x, dy = b.y - a.y;
  const ang = Math.atan2(dy, dx), eyeDist = Math.hypot(dx, dy);
  const W = eyeDist * 1.62, H = eyeDist * 0.5, lens = W * 0.42, bridge = W * 0.16;
  ctx.save();
  ctx.translate(cx, cy + H * 0.08); ctx.rotate(ang);
  const lw = Math.max(3, W * 0.05);
  // armação: barra de cima larga, lentes trapezoidais (estilo do mascote)
  ctx.fillStyle = INK;
  const lensPath = (x0) => {
    ctx.beginPath();
    ctx.moveTo(x0, -H * 0.42);
    ctx.lineTo(x0 + lens, -H * 0.42);
    ctx.lineTo(x0 + lens * 0.9, H * 0.48);
    ctx.quadraticCurveTo(x0 + lens * 0.5, H * 0.62, x0 + lens * 0.1, H * 0.48);
    ctx.closePath();
  };
  [-bridge / 2 - lens, bridge / 2].forEach(x0 => { lensPath(x0); ctx.fill(); });
  ctx.fillRect(-W / 2, -H * 0.55, W, H * 0.22);                 // barra superior
  ctx.fillRect(-bridge / 2 - 1, -H * 0.4, bridge + 2, H * 0.18); // ponte
  // reflexos creme em diagonal, como no desenho
  ctx.save();
  [-bridge / 2 - lens, bridge / 2].forEach(x0 => {
    ctx.save(); lensPath(x0); ctx.clip();
    ctx.fillStyle = CREAM;
    for (const off of [0.28, 0.55]) {
      ctx.beginPath();
      const bx = x0 + lens * off, w = lens * 0.13;
      ctx.moveTo(bx, -H * 0.35); ctx.lineTo(bx + w, -H * 0.35); ctx.lineTo(bx + w - H * 0.45, H * 0.5); ctx.lineTo(bx - H * 0.45, H * 0.5); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  });
  ctx.restore();
  // contorno leve para destacar em fundo escuro
  ctx.strokeStyle = 'rgba(243,230,204,.25)'; ctx.lineWidth = Math.max(1, lw * 0.25);
  ctx.strokeRect(-W / 2, -H * 0.55, W, H * 0.22);
  ctx.restore();
}
function drawMohawk(ctx, g) {
  const faceW = Math.hypot(g.sideR.x - g.sideL.x, g.sideR.y - g.sideL.y);
  const ux = g.top.x - g.chin.x, uy = g.top.y - g.chin.y;
  const faceH = Math.hypot(ux, uy);
  const up = { x: ux / faceH, y: uy / faceH };
  const ang = Math.atan2(up.x, -up.y);
  // base um pouco acima da testa
  const bx = g.top.x + up.x * faceH * 0.05, by = g.top.y + up.y * faceH * 0.05;
  const baseW = faceW * 0.62, spikeH = faceH * 0.78;
  ctx.save();
  ctx.translate(bx, by); ctx.rotate(ang);
  // espetos: alturas e inclinações inspiradas no mascote (mais altos no meio, puxando para a direita)
  const spikes = [
    { t: 0.00, h: 0.55, lean: -0.10 }, { t: 0.18, h: 0.85, lean: -0.02 }, { t: 0.36, h: 1.00, lean: 0.05 },
    { t: 0.54, h: 0.92, lean: 0.14 }, { t: 0.72, h: 0.74, lean: 0.24 }, { t: 0.90, h: 0.52, lean: 0.34 }
  ];
  const sw = baseW / spikes.length * 1.45;
  const pts = spikes.map(s => {
    const x = -baseW / 2 + s.t * baseW + sw / 2;
    return { bl: x - sw / 2, br: x + sw / 2, tx: x + s.lean * spikeH, ty: -s.h * spikeH, h: s.h };
  });
  // corpo preto
  ctx.fillStyle = INK;
  ctx.beginPath();
  ctx.moveTo(-baseW / 2 - sw * 0.1, faceH * 0.06);
  pts.forEach(p => { ctx.lineTo(p.bl, 0); ctx.lineTo(p.tx, p.ty); ctx.lineTo(p.br, 0); });
  ctx.lineTo(baseW / 2 + sw * 0.6, faceH * 0.06);
  ctx.closePath(); ctx.fill();
  // brilho creme dentro de cada espeto
  ctx.fillStyle = CREAM;
  pts.forEach(p => {
    const mx = (p.bl + p.br) / 2;
    ctx.beginPath();
    ctx.moveTo(mx - sw * 0.12, -spikeH * 0.06);
    ctx.lineTo(p.tx - (p.tx - mx) * 0.18, p.ty * 0.82);
    ctx.lineTo(mx + sw * 0.06, -spikeH * 0.06);
    ctx.closePath(); ctx.fill();
  });
  ctx.restore();
}

/* ---------- Moldura ---------- */
function drawFrame(ctx) {
  // faixa inferior
  const bh = 190;
  const g = ctx.createLinearGradient(0, OUT_H - bh - 80, 0, OUT_H);
  g.addColorStop(0, 'rgba(13,10,9,0)'); g.addColorStop(0.35, 'rgba(13,10,9,.88)'); g.addColorStop(1, 'rgba(13,10,9,.96)');
  ctx.fillStyle = g; ctx.fillRect(0, OUT_H - bh - 80, OUT_W, bh + 80);
  ctx.fillStyle = '#e8102e'; ctx.fillRect(0, OUT_H - 14, OUT_W, 14);
  // mascote no canto
  if (mascote.complete && mascote.naturalWidth) {
    const h = 210, w = h * mascote.naturalWidth / mascote.naturalHeight;
    ctx.save(); ctx.translate(OUT_W - 40, OUT_H - 30 - h); ctx.scale(-1, 1);
    ctx.drawImage(mascote, 0, 0, w, h); ctx.restore();
  }
  ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
  ctx.fillStyle = '#f2b632'; ctx.font = '700 34px Barlow, sans-serif';
  ctx.fillText('EU VIREI UM', 48, OUT_H - 160);
  ctx.fillStyle = '#f3e6cc'; ctx.font = '76px Bungee, Impact, sans-serif';
  ctx.fillText('GABBA!', 44, OUT_H - 82);
  ctx.fillStyle = '#b5a397'; ctx.font = '700 32px Barlow, sans-serif';
  ctx.fillText('@gabbaburger', 48, OUT_H - 36);
  // selo no topo
  ctx.save();
  ctx.font = '30px Bungee, Impact, sans-serif'; const label = 'GABBA HEY BURGER';
  const tw = ctx.measureText(label).width;
  ctx.fillStyle = 'rgba(13,10,9,.72)'; roundRect(ctx, 32, 30, tw + 44, 62, 31); ctx.fill();
  ctx.fillStyle = '#ff4d63'; ctx.shadowColor = '#e8102e'; ctx.shadowBlur = 14;
  ctx.fillText(label, 54, 74);
  ctx.restore();
}
function roundRect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

/* ---------- Render ---------- */
function render(ctx, withGuide) {
  const cr = coverRect();
  ctx.save();
  if (facing === 'user') { ctx.translate(OUT_W, 0); ctx.scale(-1, 1); }
  ctx.drawImage(video, cr.ox, cr.oy, cr.vw * cr.s, cr.vh * cr.s);
  ctx.restore();
  if (landmarker && smooth.length) {
    smooth.forEach(g => { drawMohawk(ctx, g); drawGlasses(ctx, g); });
  } else if (!landmarker && withGuide !== false) {
    // sem detecção: acessórios fixos e um guia para encaixar o rosto
    const g = { eyeL: { x: OUT_W * 0.38, y: OUT_H * 0.42 }, eyeR: { x: OUT_W * 0.62, y: OUT_H * 0.42 }, top: { x: OUT_W / 2, y: OUT_H * 0.27 }, chin: { x: OUT_W / 2, y: OUT_H * 0.66 }, sideL: { x: OUT_W * 0.3, y: OUT_H * 0.45 }, sideR: { x: OUT_W * 0.7, y: OUT_H * 0.45 } };
    drawMohawk(ctx, g); drawGlasses(ctx, g);
  }
  drawFrame(ctx);
}

function loop() {
  if (!running) return;
  if (video.readyState >= 2) {
    if (landmarker && video.currentTime !== lastVideoTime) {
      lastVideoTime = video.currentTime;
      try {
        const res = landmarker.detectForVideo(video, performance.now());
        const cr = coverRect();
        const next = (res.faceLandmarks || []).map(lm => faceGeom(lm, cr));
        // casa cada rosto com o mais próximo do quadro anterior para suavizar
        smooth = next.map(n => {
          let best = null, bd = Infinity;
          smooth.forEach(s => { const d = Math.hypot(s.bridge.x - n.bridge.x, s.bridge.y - n.bridge.y); if (d < bd) { bd = d; best = s; } });
          return bd < 200 ? lerpGeom(best, n, 0.55) : n;
        });
        $('status').hidden = smooth.length > 0;
        if (!smooth.length) $('status').textContent = 'Mostre o rosto para a câmera';
      } catch (e) {}
    }
    render(vctx);
  }
  requestAnimationFrame(loop);
}

/* ---------- Telas ---------- */
function show(id) { ['start', 'cam', 'result'].forEach(s => { $(s).hidden = s !== id; }); }

$('open').addEventListener('click', async () => {
  $('start-err').hidden = true;
  try {
    await startCamera();
  } catch (e) {
    $('start-err').textContent = 'Não consegui abrir a câmera. Libere o acesso à câmera para este site nas configurações do navegador e tente de novo.';
    $('start-err').hidden = false;
    return;
  }
  conta('vire-abriu', 'Vire um Gabba: abriu a câmera');
  show('cam'); running = true;
  $('status').hidden = false; $('status').textContent = 'Carregando o filtro…';
  requestAnimationFrame(loop);
  await landmarkerReady;
  if (!landmarker) { $('status').hidden = false; $('status').textContent = 'Encaixe o rosto embaixo do moicano'; }
});

$('flip').addEventListener('click', async () => {
  facing = facing === 'user' ? 'environment' : 'user';
  smooth = [];
  try { await startCamera(); } catch (e) { facing = facing === 'user' ? 'environment' : 'user'; try { await startCamera(); } catch (e2) {} }
});

$('back').addEventListener('click', () => { running = false; stopCamera(); show('start'); });

let blob = null, blobUrl = null;
$('shoot').addEventListener('click', () => {
  if (video.readyState < 2) return;
  const out = document.createElement('canvas'); out.width = OUT_W; out.height = OUT_H;
  render(out.getContext('2d'));
  $('flash').classList.add('on'); setTimeout(() => $('flash').classList.remove('on'), 60);
  out.toBlob(b => {
    if (!b) return;
    blob = b;
    if (blobUrl) URL.revokeObjectURL(blobUrl);
    blobUrl = URL.createObjectURL(b);
    $('photo').src = blobUrl; $('save').href = blobUrl;
    const file = new File([b], 'vire-um-gabba.jpg', { type: 'image/jpeg' });
    $('share').hidden = !(navigator.canShare && navigator.canShare({ files: [file] }));
    running = false; stopCamera();
    conta('vire-foto', 'Vire um Gabba: tirou foto');
    show('result');
  }, 'image/jpeg', 0.92);
});

$('share').addEventListener('click', async () => {
  if (!blob) return;
  const file = new File([blob], 'vire-um-gabba.jpg', { type: 'image/jpeg' });
  try {
    await navigator.share({ files: [file], text: 'Virei um Gabba! 🤘 @gabbaburger #GabbaBurger' });
    conta('vire-compartilhou', 'Vire um Gabba: compartilhou');
  } catch (e) {}
});
$('save').addEventListener('click', () => conta('vire-salvou', 'Vire um Gabba: salvou'));

$('again').addEventListener('click', async () => {
  try { await startCamera(); } catch (e) { show('start'); return; }
  show('cam'); running = true; requestAnimationFrame(loop);
});

document.addEventListener('visibilitychange', () => { if (document.hidden && running) { running = false; stopCamera(); show('start'); } });
</script>
<script>
/* Impede o zoom por toque duplo e por pinça (iPhone ignora user-scalable=no) */
(function () {
  let lastEnd = 0;
  document.addEventListener('touchend', function (e) {
    const now = Date.now();
    const onControl = e.target && e.target.closest && e.target.closest('button, a, input, select, textarea, label');
    if (!onControl && now - lastEnd < 350) e.preventDefault();
    lastEnd = now;
  }, { passive: false });
  document.addEventListener('dblclick', function (e) { e.preventDefault(); }, { passive: false });
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (t) {
    document.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false });
  });
  document.addEventListener('touchmove', function (e) { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });
})();
</script>
</body>
